<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rashid Register</title>
<meta name="description" content="Madaris donation register - look up any madrasa, see every year you have given, record a new donation.">
<meta name="theme-color" content="#F7F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E0D" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rashid">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ===================== tokens: near-monochrome, one accent ===================== */
:root{
  --ground:#F7F7F6; --surface:#FFFFFF; --sunk:#F0F0EF; --hover:#FAFAFA;
  --ink:#111413; --ink2:#565B58; --muted:#868C88; --faint:#AEB3AF;
  --hair:#E5E6E4; --hair2:#D2D4D1;
  --accent:#0A6B45; --accent-ink:#075637; --accent-soft:#E8F2EC; --accent-line:#A9CFBC;
  --alert:#A33526; --alert-soft:#F9EAE7;
  --sh1:0 0 0 1px var(--hair);
  --sh2:0 0 0 1px var(--hair), 0 6px 18px -12px rgba(17,20,19,.3);
  --sh3:0 -1px 0 var(--hair);
  --r1:10px; --r2:13px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0C0E0D; --surface:#161918; --sunk:#121514; --hover:#1C201E;
  --ink:#EDEFEE; --ink2:#AFB5B1; --muted:#868E89; --faint:#5F6762;
  --hair:#242826; --hair2:#333833;
  --accent:#3FB983; --accent-ink:#5FCE9B; --accent-soft:#11291E; --accent-line:#2B5E45;
  --alert:#DE7B67; --alert-soft:#2C1715;
  --sh1:0 0 0 1px var(--hair);
  --sh2:0 0 0 1px var(--hair), 0 6px 20px -12px rgba(0,0,0,.8);
  --sh3:0 -1px 0 var(--hair);
}}
:root[data-theme="dark"]{
  --ground:#0C0E0D; --surface:#161918; --sunk:#121514; --hover:#1C201E;
  --ink:#EDEFEE; --ink2:#AFB5B1; --muted:#868E89; --faint:#5F6762;
  --hair:#242826; --hair2:#333833;
  --accent:#3FB983; --accent-ink:#5FCE9B; --accent-soft:#11291E; --accent-line:#2B5E45;
  --alert:#DE7B67; --alert-soft:#2C1715;
  --sh1:0 0 0 1px var(--hair);
  --sh2:0 0 0 1px var(--hair), 0 6px 20px -12px rgba(0,0,0,.8);
  --sh3:0 -1px 0 var(--hair);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;overflow:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
input,textarea,[data-sel]{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
:focus:not(:focus-visible){outline:none}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--hair2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}

#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.side{display:flex;flex-direction:column;min-height:0;flex:1;background:var(--ground)}
.detail{display:none}
@media (min-width:1700px){
  #app{max-width:1700px;margin:0 auto;box-shadow:0 0 0 1px var(--hair)}
  body{background:var(--sunk)}
}
/* a wide pane splits in two so the record is beside the history, not below it */
@media (min-width:1280px){
  .detail .inner{max-width:1120px}
  .dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
  .dcols > div{min-width:0}
}
@media (min-width:940px){
  #app{flex-direction:row}
  .side{flex:0 0 430px;max-width:430px;border-right:1px solid var(--hair)}
  .detail{display:flex;flex-direction:column;flex:1;min-width:0;background:var(--sunk)}
  .dock{display:none!important}
}
@media (min-width:1280px){ .side{flex:0 0 470px;max-width:470px} }
@media (min-width:1700px){ .side{flex:0 0 510px;max-width:510px} }

/* header */
.hd{padding:14px 16px 0;flex:none}
.hdrow{display:flex;align-items:center;gap:10px;padding-bottom:11px}
.mark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17.5px;letter-spacing:.17em}
.sub{font-size:12px;color:var(--faint);white-space:nowrap}
@media (max-width:420px){ .sub{display:none} }
@media (max-width:939px){ #bKeys{display:none} }
.hdrow .sp{margin-left:auto}
.ib{height:36px;min-width:36px;padding:0 10px;border-radius:9px;background:var(--surface);box-shadow:var(--sh1);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;
  color:var(--ink2);white-space:nowrap;flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ib .dot.ok{background:var(--accent)} .ib .dot.busy{background:var(--ink2)}

.sb{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;margin-bottom:11px;
  background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1)}
.sb:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sb svg{flex:none;color:var(--faint)}
#q{flex:1;min-width:0;border:none;background:none;outline:none;font-size:16px}
#q::placeholder{color:var(--faint)}
.qx{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--faint);font-size:14px;flex:none}
.qx:hover{background:var(--sunk);color:var(--ink)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tile{background:var(--surface);border-radius:var(--r1);padding:9px 4px 10px;text-align:center;box-shadow:var(--sh1)}
.tile:hover{background:var(--hover)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.tile b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16.5px;
  line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.022em;color:var(--ink)}
.tile b.hl{color:var(--accent-ink)}
.tile s{display:block;text-decoration:none;font-size:9px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-top:3px}
.today{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:var(--r1);
  background:var(--accent-soft);font-size:12.5px;color:var(--accent-ink);font-weight:500}
.today b{font-weight:700;font-variant-numeric:tabular-nums}

/* list */
.listwrap{flex:1;min-height:0;padding:0 16px}
.sec{display:flex;align-items:baseline;gap:10px;padding:14px 2px 8px}
.sec .c{margin-left:auto;font-size:12px;color:var(--faint)}
.rows{display:flex;flex-direction:column;gap:6px;padding-bottom:20px}

.row{width:100%;text-align:left;display:block;position:relative;overflow:hidden;background:var(--surface);
  border-radius:var(--r2);box-shadow:var(--sh1);padding:12px 14px 11px 16px}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.row.given::before{background:var(--accent)}
.row:hover{background:var(--hover)}
.row.sel{box-shadow:0 0 0 2px var(--accent)}
.rtop{display:flex;gap:11px;align-items:flex-start}
.rname{flex:1;min-width:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14.5px;
  line-height:1.3;letter-spacing:-.012em}
.ramt{flex:none;text-align:right}
.ramt b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;color:var(--ink)}
.ramt b.on{color:var(--accent-ink)}
.ramt s{display:block;text-decoration:none;font-size:10px;color:var(--faint);margin-top:1px;white-space:nowrap}
.raddr{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.38}
.rfoot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.regd{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
.regd em{font-style:normal;font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-family:"IBM Plex Sans",sans-serif}
.regd.none{color:var(--faint)}
.yrs{display:flex;gap:4px;margin-left:auto}
.yrchip{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 6px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}

.row.cursor{box-shadow:0 0 0 2px var(--ink)}
.qdate{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.qdate .dqb{height:36px;font-size:12.5px}
.qfields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.qfields .qdi{flex:none;max-width:none;width:100%}
.qnum{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.qdi{height:38px;border-radius:99px;background:var(--sunk);border:none;outline:none;
  padding:0 12px;font-size:16px;color:var(--ink2);min-width:0;flex:1}
.qdi:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;
  border-radius:5px;background:var(--sunk);box-shadow:var(--sh1);font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--ink2);margin-right:3px}
.khelp{display:flex;align-items:center;gap:10px;padding:9px 15px;border-top:1px solid var(--hair);font-size:13px}
.khelp:first-child{border-top:none}
.khelp .d{margin-left:auto;color:var(--muted);text-align:right}

/* number fields carried browser spinners, which looked like a stray control */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
/* the date field showed its own clear/expand affordances inconsistently */
input[type=date]::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer}
input[type=date]::-webkit-calendar-picker-indicator:hover{opacity:1}
.sbfk{flex:none;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);
  background:var(--sunk);border-radius:5px;padding:2px 6px}
@media (max-width:939px){ .sbfk{display:none} }
.regd.none em{opacity:.6}
.tt .ids .regd{background:var(--sunk);border-radius:6px;padding:3px 8px}
.detail .tt h1{font-size:25px}
.rhead{background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1);padding:18px 18px 16px;margin-bottom:12px}
.rhero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.rhero .amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rhero .delta{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:99px;margin-bottom:4px}
.rhero .delta.up{background:var(--accent-soft);color:var(--accent-ink)}
.rhero .delta.down{background:var(--alert-soft);color:var(--alert)}
.rhero .delta.flat{background:var(--sunk);color:var(--muted)}
.rsub{font-size:12.5px;color:var(--muted);margin-top:7px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);
  border-radius:var(--r1);overflow:hidden;margin-top:15px}
.rstats div{background:var(--surface);padding:11px 12px}
.rstats .k{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rstats .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.022em}

.chartwrap{position:relative;padding:6px 15px 14px}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.cbar{fill:var(--accent);opacity:.82;transition:opacity .12s}
.cbar:hover,.cbar.hot{opacity:1}
.cgrid{stroke:var(--hair);stroke-width:1}
.clab{fill:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:10px}
.cval{fill:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:11px}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--ground);border-radius:8px;
  padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-115%);
  opacity:0;transition:opacity .1s;box-shadow:0 6px 18px -8px rgba(0,0,0,.5);z-index:3}
.ctip b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.ctip.on{opacity:1}

.toprow{display:grid;grid-template-columns:1fr auto;gap:11px;align-items:center;padding:9px 15px;
  border-top:1px solid var(--hair)}
.toprow:first-of-type{border-top:none}
.toprow .tn{font-size:13px;line-height:1.3;min-width:0}
.toprow .tn s{display:block;text-decoration:none;font-size:11px;color:var(--faint);margin-top:2px}
.toprow .tb{grid-column:1/-1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.toprow .tb i{display:block;height:100%;background:var(--accent-line);border-radius:99px}
.toprow .ta{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.mix{display:flex;gap:7px;flex-wrap:wrap;padding:4px 15px 14px}
.mixp{background:var(--sunk);border-radius:9px;padding:8px 11px;min-width:74px}
.mixp .k{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.mixp .v{font-size:11px;color:var(--muted);margin-top:1px}
.fk{display:inline-flex;align-items:center;justify-content:center;height:17px;padding:0 5px;border-radius:4px;
  background:rgba(255,255,255,.2);font-family:"IBM Plex Mono",monospace;font-size:10px;margin-left:7px}
.btn.quiet .fk,.dqb .fk{background:var(--hair);color:var(--muted)}
@media (max-width:939px){ .fk{display:none} }
.rpresets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.rp{height:36px;padding:0 13px;border-radius:99px;background:var(--surface);box-shadow:var(--sh1);
  font-size:13px;font-weight:500;color:var(--ink2)}
.rp:hover{background:var(--hover)}
.rp.on{background:var(--accent);color:#fff;box-shadow:none;font-weight:600}
.rrange{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
@media (min-width:620px){ .big4{grid-template-columns:repeat(4,1fr)} }
.b4{background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1);padding:13px 14px}
.b4 .k{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.b4 .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:21px;margin-top:4px;
  font-variant-numeric:tabular-nums;letter-spacing:-.026em}
.b4 .v.hl{color:var(--accent-ink)}
.bars{padding:4px 15px 13px}
.bline{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;padding:5px 0}
.bline .bl{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.bline .bt{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bline .bt i{display:block;height:100%;background:var(--accent-line);border-radius:99px}
.bline .bv{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:12.5px;
  font-variant-numeric:tabular-nums;text-align:right}
.dlist{max-height:none}
.drow{display:grid;grid-template-columns:58px 1fr auto;gap:11px;align-items:center;padding:10px 15px;
  border-top:1px solid var(--hair);width:100%;text-align:left}
.drow:first-of-type{border-top:none}
.drow:hover{background:var(--hover)}
.drow .dd{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.drow .dn{font-size:13px;line-height:1.3;min-width:0}
.drow .dn s{display:block;text-decoration:none;font-size:11px;color:var(--faint);margin-top:1px}
.drow .da{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;
  font-variant-numeric:tabular-nums;text-align:right}
.sortrow{display:flex;gap:6px;padding:0 15px 11px;flex-wrap:wrap}
@media print{
  body{overflow:visible;height:auto}
  .side,.dock,.act,.bar,#toasts,.rpresets,.rrange,.sortrow,.btn{display:none!important}
  #app,.detail,.body{display:block!important;height:auto!important;overflow:visible!important;background:#fff!important}
  .panel,.b4{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
}
.quick{background:var(--surface);border-radius:0 0 var(--r2) var(--r2);box-shadow:var(--sh1);
  margin-top:-8px;padding:13px 14px 12px;position:relative;z-index:1}
.quick .ql{font-size:12.5px;color:var(--ink2);margin-bottom:9px;line-height:1.4}
.quick .ql b{font-weight:600;color:var(--ink)}
.quick .ql .nw{color:var(--accent-ink);font-weight:700}
.quick .ql .al{color:var(--alert);font-weight:700}
.qamts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qa{height:46px;border-radius:9px;background:var(--sunk);font-family:"Bricolage Grotesque",sans-serif;
  font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;display:flex;align-items:center;
  justify-content:center;position:relative}
.qa:hover{background:var(--hair)}
.qa.on{background:var(--accent);color:#fff}
.qa i{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-style:normal;font-size:7.5px;
  font-weight:700;letter-spacing:.07em;background:var(--ink);color:var(--ground);padding:2px 6px;
  border-radius:99px;white-space:nowrap}
.qgo{display:flex;gap:7px;margin-top:8px}
.qgo .go{flex:1;height:46px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;
  font-size:14.5px;display:flex;align-items:center;justify-content:center}
.qgo .go:disabled{opacity:.4}
.qgo .more{width:46px;height:46px;border-radius:9px;background:var(--sunk);color:var(--ink2);
  display:grid;place-items:center;font-size:16px;flex:none}
.qgo .more:hover{background:var(--hair)}
.row.open{border-radius:var(--r2) var(--r2) 0 0}
.addnew{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);
  border-radius:var(--r2);box-shadow:0 0 0 1.5px var(--accent-line);text-align:left}
.addnew:hover{background:var(--accent-soft)}
.addnew .plus{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;font-size:17px;flex:none;font-weight:600}
.addnew .t1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;line-height:1.25}
.addnew .t2{font-size:12px;color:var(--muted);margin-top:2px}

.blank{padding:44px 20px;text-align:center}
.blank .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16.5px;margin-bottom:5px}
.blank .s{color:var(--muted);font-size:13.5px;max-width:32ch;margin:0 auto;line-height:1.5}

.dock{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--ground);
  box-shadow:var(--sh3);display:flex;gap:9px}

/* buttons */

<script>
"use strict";
(function(){
/* ================================================================
   Rashid Register - a static page. Your data goes nowhere except the
   private GitHub repository you point it at yourself. Receipt reading
   runs on this device with the Tesseract engine shipped alongside.
   ================================================================ */
const $  = s => document.querySelector(s);
const el = (t,c,x)=>{ const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
const YEAR  = new Date().getFullYear();
const TODAY = () => new Date().toLocaleDateString('en-CA');
const rs  = n => '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const dmy = d => d ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4) : '';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice = d => d ? (Number(d.slice(8,10))+' '+MON[Number(d.slice(5,7))-1]+' '+d.slice(0,4)) : '';
const wide = () => window.matchMedia('(min-width:940px)').matches;

const LS = {
  get(k,d){ try{ const v=localStorage.getItem('rashid.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('rashid.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('rashid.'+k); }catch(e){} }
};

let REG=null, MAD=[], sha=null, dirty=false, pushing=false, pushTimer=null;
let query='', view='recent', selectedId=null;

/* ---------- text helpers (same rules the matcher was tested with) ---------- */
const GEO={UP:'UTTAR PRADESH',TS:'TELANGANA',WB:'WEST BENGAL',BIHARR:'BIHAR',JHANRKHAND:'JHARKHAND',JHARKAND:'JHARKHAND',HYDRABAD:'HYDERABAD',BANGAL:'BENGAL'};
function nrm(s){
  s=String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9 ]/g,' ')
   .replace(/\bMAD(?:AR|R)ASS?A\b|\bMADARSA\b|\bMADRSA\b/g,'MADRASA')
   .replace(/\bUL(?:U|O)O?M\b/g,'ULOOM').replace(/\bQURAAN\b/g,'QURAN');
  for(const k in GEO) s=s.replace(new RegExp('\\b'+k+'\\b','g'),GEO[k]);
  return s.replace(/\s+/g,' ').trim();
}
function nregd(s){
  const t=String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9/\-]/g,'').replace(/-/g,'/').replace(/\/+/g,'/');
  return t.replace(/^\/|\/$/g,'');
}
const nphone=s=>String(s==null?'':s).replace(/\D/g,'').slice(-10);
function bgs(s){ s=String(s).replace(/ /g,''); const o=new Set(); for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2)); return o; }
function dice(a,b){ if(!a.size||!b.size)return 0; let h=0; a.forEach(g=>{if(b.has(g))h++;}); return 2*h/(a.size+b.size); }
const ASTOP=new Set(['INDIA','DISTT','DIST','NEAR','ROAD','TOWN','THE','AND','POST']);
const atoks=s=>new Set(nrm(s).split(' ').filter(w=>w.length>3&&!ASTOP.has(w)));
function donId(m,d,i){ return d.id || (m.id+':'+d.year+':'+i); }

function reindex(){
  MAD=[];
  const byId=new Map(REG.madaris.map(m=>[m.id,m]));
  const folded=new Map();
  REG.madaris.forEach(m=>{
    if(!m.mergedInto) return;
    const t=byId.get(m.mergedInto); if(!t||t.mergedInto) return;
    if(!folded.has(t.id)) folded.set(t.id,[]);
    folded.get(t.id).push(m);
  });
  REG.madaris.filter(s=>!s.mergedInto&&!s.deleted).forEach(src=>{
    const m=Object.assign({},src);
    m.altNames=(src.altNames||[]).slice(); m.altAddresses=(src.altAddresses||[]).slice(); m.altRegds=(src.altRegds||[]).slice();
    m.donations=(src.donations||[]).map((d,i)=>Object.assign({},d,{id:donId(src,d,i)}));
    (folded.get(src.id)||[]).forEach(g=>{
      (g.donations||[]).forEach((d,i)=>m.donations.push(Object.assign({},d,{id:donId(g,d,i)})));
      if(g.name&&g.name!==m.name) m.altNames.push(g.name);
      if(g.address&&g.address!==m.address) m.altAddresses.push(g.address);
      if(g.regd&&g.regd!==m.regd) m.altRegds.push(g.regd);
      if(!m.phone&&g.phone) m.phone=g.phone;
    });
    m.altNames=[...new Set(m.altNames)]; m.altAddresses=[...new Set(m.altAddresses)]; m.altRegds=[...new Set(m.altRegds)];
    m.donations.sort((a,b)=>(a.date||String(a.year)).localeCompare(b.date||String(b.year)));
    const paid=m.donations.filter(d=>d.amount!=null&&d.amount!=='');
    m.total=paid.reduce((s,d)=>s+Number(d.amount),0);
    m.years=[...new Set(m.donations.map(d=>Number(d.year)))].sort();
    m.lastYear=m.years.length?m.years[m.years.length-1]:null;
    m.last=paid.length?paid[paid.length-1]:null;
    m.lastAmount=m.last?Number(m.last.amount):null;
    m.thisYear=m.donations.filter(d=>Number(d.year)===YEAR);
    m.thisYearTotal=m.thisYear.reduce((s,d)=>s+Number(d.amount||0),0);
    m.gave=m.thisYear.some(d=>d.amount!=null&&d.amount!=='');
    m.priorYears=m.years.filter(y=>y<YEAR).length;
    const tally={}; paid.forEach(d=>{tally[d.amount]=(tally[d.amount]||0)+1;});
    m.usual=paid.length?Number(Object.keys(tally).sort((a,b)=>tally[b]-tally[a]||Number(b)-Number(a))[0]):null;
    m.peak=paid.length?Math.max(...paid.map(d=>Number(d.amount))):0;
    m.isNew=m.years.length===0;
    m.lapsed=!m.gave&&m.lastYear===YEAR-1;
    m.regular=m.priorYears>=3;
    const names=[m.name].concat(m.altNames).filter(Boolean);
    const addrs=[m.address].concat(m.altAddresses).filter(Boolean);
    m._n=nrm(names.join(' ')); m._bgv=names.map(v=>bgs(nrm(v)));
    m._tok=new Set((m._n+' '+nrm(addrs.join(' '))).split(' ').filter(w=>w.length>1));
    m._atok=atoks(addrs.join(' '));
    m._r=[m.regd].concat(m.altRegds).map(nregd).filter(Boolean);
    m._p=nphone(m.phone);
    m._all=new Set([...m._tok].filter(w=>w.length>=4));
    MAD.push(m);
  });
  MAD.sort((a,b)=>a.name.localeCompare(b.name));
  // how many madaris use each word: a word only one of them uses identifies it
  DF=new Map();
  MAD.forEach(m=>m._all.forEach(w=>DF.set(w,(DF.get(w)||0)+1)));
  const N=Math.max(MAD.length,1);
  IDF=w=>Math.log(N/(1+(DF.get(w)||0)));
  MAD.forEach(m=>{ let t=0; m._all.forEach(w=>{t+=IDF(w);}); m._self=t||1; });
}
let DF=new Map(), IDF=()=>0;

/* Match a whole photo's text against the register by how rare each word is,
   rather than guessing which line is the name. */
function matchFromText(blob){
  const words=new Set(nrm(blob).split(' ').filter(w=>w.length>=4));
  const regds=new Set();
  (String(blob).match(/[0-9]{2,}[0-9A-Za-z/\-]*/g)||[]).forEach(t=>{
    const v=nregd(t);
    if(v.length>=3 && !/^(19|20)[0-9]{2}$/.test(v)) regds.add(v);
  });
  const phones=new Set(String(blob).replace(/[^0-9]/g,' ').split(' ').filter(t=>/^[6-9][0-9]{9}$/.test(t)));
  const out=[];
  for(const m of MAD){
    const hard=m._r.some(r=>regds.has(r))||(m._p&&phones.has(m._p));
    const shared=[]; let w=0;
    m._all.forEach(t=>{ if(words.has(t)){ shared.push(t); w+=IDF(t); } });
    const sc=w+40*(w/m._self)+(hard?100:0);
    if(sc>0) out.push({m,sc,w,hard,shared});
  }
  out.sort((a,b)=>b.sc-a.sc);
  return out.slice(0,5);
}

function search(rawq){
  const qq=String(rawq||'').trim(); if(!qq) return [];
  const qr=nregd(qq), qp=nphone(qq), qn=nrm(qq);
  const terms=qn.split(' ').filter(Boolean), qbg=bgs(qn), out=[];
  for(const m of MAD){
    let sc=0, why='';
    if(qr.length>=2) for(const r of m._r){
      if(r===qr){sc=Math.max(sc,1000);why='Regd No';}
      else if(qr.length>=3&&r.startsWith(qr)){sc=Math.max(sc,900);why='Regd No';}
      else if(qr.length>=4&&r.includes(qr)){sc=Math.max(sc,860);why='Regd No';}
    }
    if(qp.length>=4&&m._p&&m._p.includes(qp)){sc=Math.max(sc,950);why='Phone';}
    if(terms.length){
      let ok=true,tot=0;
      for(const t of terms){
        let b=0;
        for(const w of m._tok){
          if(w===t)b=Math.max(b,10); else if(w.startsWith(t))b=Math.max(b,8);
          else if(t.length>=4&&w.includes(t))b=Math.max(b,5);
        }
        if(!b){ok=false;break;} tot+=b;
      }
      if(ok){ let s=300+tot*8; if(m._n.startsWith(qn))s+=160; if(s>sc){sc=s;} }
    }
    if(sc===0&&qn.length>=4){
      let d=0; for(const v of m._bgv) d=Math.max(d,dice(qbg,v));
      if(d>=0.55){ sc=Math.round(d*520); why='Close spelling'; }
    }
    if(sc>0) out.push({m,sc,why});
  }
  out.sort((a,b)=>b.sc-a.sc||b.m.total-a.m.total||a.m.name.localeCompare(b.m.name));
  return out.slice(0,60);
}

/* ---------- persistence ---------- */
function saveLocal(){ LS.set('register',REG); }
function touch(){ REG.updated=new Date().toISOString(); saveLocal(); reindex(); dirty=true; schedulePush(); }

const GH={
  cfg(){ return LS.get('gh',null); }, set(c){ LS.set('gh',c); }, clear(){ LS.del('gh'); },
  path(){ const c=this.cfg(); return '/repos/'+c.owner+'/'+c.repo+'/contents/'+(c.path||'register.json'); },
  api(p,o){
    const c=this.cfg();
    return fetch('https://api.github.com'+p, Object.assign({},o,{headers:Object.assign({
      'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'
    },(o&&o.headers)||{})}));
  },
  async pull(){
    const r=await this.api(this.path()+'?ref='+encodeURIComponent(this.cfg().branch||'main'),{cache:'no-store'});
    if(r.status===404) return {missing:true};
    if(!r.ok) throw new Error('GitHub said '+r.status+(r.status===401?' — the token was rejected':''));
    const j=await r.json(); sha=j.sha;
    return {data:JSON.parse(b64dec(j.content))};
  },
  async push(reg){
    const c=this.cfg();
    const body={message:'Register updated '+new Date().toLocaleString('en-IN'),content:b64enc(JSON.stringify(reg,null,1)),branch:c.branch||'main'};
    if(sha) body.sha=sha;
    const r=await this.api(this.path(),{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||r.status===422) return {conflict:true};
    if(!r.ok) throw new Error('GitHub said '+r.status);
    const j=await r.json(); sha=j.content&&j.content.sha; return {ok:true};
  }
};
function b64enc(str){
  const b=new TextEncoder().encode(str); let s=''; const C=0x8000;
  for(let i=0;i<b.length;i+=C) s+=String.fromCharCode.apply(null,b.subarray(i,i+C));
  return btoa(s);
}
function b64dec(x){
  const s=atob(String(x).replace(/\s/g,'')); const b=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i);
  return new TextDecoder().decode(b);
}
function mergeReg(mine,theirs){
  const out=JSON.parse(JSON.stringify(theirs));
  const byId=new Map(out.madaris.map(m=>[m.id,m]));
  mine.madaris.forEach(m=>{
    const t=byId.get(m.id);
    if(!t){ out.madaris.push(JSON.parse(JSON.stringify(m))); return; }
    const seen=new Set((t.donations||[]).map((d,i)=>donId(t,d,i)));
    (m.donations||[]).forEach((d,i)=>{ if(!seen.has(donId(m,d,i))) t.donations.push(Object.assign({},d)); });
    ['phone','notes','regd','address','name'].forEach(k=>{ if((!t[k]||t[k]==='')&&m[k]) t[k]=m[k]; });
    if(m.mergedInto&&!t.mergedInto) t.mergedInto=m.mergedInto;
    if(m.deleted) t.deleted=true;
  });
  out.reviewDecisions=Object.assign({},theirs.reviewDecisions||{},mine.reviewDecisions||{});
  out.updated=new Date().toISOString();
  return out;
}
function schedulePush(){ syncBadge(); if(!GH.cfg())return; clearTimeout(pushTimer); pushTimer=setTimeout(pushNow,1200); }
async function pushNow(){
  if(!GH.cfg()||pushing||!dirty) return;
  pushing=true; syncBadge();
  try{
    let r=await GH.push(REG);
    if(r.conflict){
      const rem=await GH.pull();
      if(rem.data){ REG=mergeReg(REG,rem.data); saveLocal(); reindex(); renderAll(); }
      r=await GH.push(REG);
      if(r.conflict) throw new Error('could not settle a conflicting change');
    }
    dirty=false;
  }catch(e){ console.warn(e); toast(String(e.message||e),{bad:true}); }
  finally{ pushing=false; syncBadge(); }
}
function syncBadge(){
  const d=$('#dSync'), t=$('#tSync'); if(!d) return;
  if(!GH.cfg()){ d.className='dot'; t.textContent='Local'; return; }
  if(pushing){ d.className='dot busy'; t.textContent='Saving'; return; }
  if(dirty){ d.className='dot busy'; t.textContent='Unsaved'; return; }
  d.className='dot ok'; t.textContent='Synced';
}

/* ---------- mutations ---------- */
const rawMad = id => REG.madaris.find(m=>m.id===id);
function addDonation(id,amount,date,noteText){
  const m=rawMad(id); if(!m) return null;
  const rec={id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    year:Number(String(date).slice(0,4)),amount:Number(amount),date:String(date),
    src:'app',note:noteText||'',ts:Date.now()};
  (m.donations=m.donations||[]).push(rec);
  touch(); return rec.id;
}
function editDonation(mid,did,patch){
  const m=rawMad(mid); if(!m) return;
  const d=(m.donations||[]).find((x,i)=>donId(m,x,i)===did); if(!d) return;
  Object.assign(d,patch);
  if(patch.date) d.year=Number(String(patch.date).slice(0,4));
  touch();
}
function dropDonation(mid,did){
  const m=rawMad(mid); if(!m) return;
  m.donations=(m.donations||[]).filter((x,i)=>donId(m,x,i)!==did);
  touch();
}
function patchMad(id,p){
  const m=rawMad(id);
  if(m) Object.assign(m,p);
  else REG.madaris.push(Object.assign({id,name:'',address:'',regd:'',phone:'',notes:'',altNames:[],altAddresses:[],altRegds:[],donations:[]},p));
  touch();
}
function dropMad(id){
  REG.madaris=REG.madaris.filter(m=>m.id!==id); touch();
}

function toast(msg,opt){
  opt=opt||{};
  const t=el('div','toast'+(opt.bad?' bad':''));
  t.appendChild(el('span',null,msg));
  let killed=false;
  if(opt.actionLabel&&opt.action){
    const b=el('button',null,opt.actionLabel); b.type='button';
    b.addEventListener('click',()=>{ killed=true; t.remove(); opt.action(); });
    t.appendChild(b);
  }
  $('#toasts').appendChild(t);
  setTimeout(()=>{ if(!killed) t.remove(); }, opt.bad?4600:(opt.action?6000:2400));
}

/* one line telling you where this madrasa stands, without opening anything */
function standing(m){
  const w=el('div','ql');
  if(m.isNew){
    const s=el('span','nw','NEW'); w.append(s,document.createTextNode('  ·  nothing recorded before'));
  }else if(m.gave){

    w.append(document.createTextNode('  ·  '+rs(m.thisYearTotal)+' this year'+
      (m.thisYear.filter(d=>d.date).length?(' on '+nice(m.thisYear.filter(d=>d.date).slice(-1)[0].date)):'')));
  }else{
    w.append(document.createTextNode('Given '));

    if(m.last) w.append(document.createTextNode('  ·  last '+rs(m.last.amount)+' on '+nice(m.last.date||(m.lastYear+'-01-01'))));
  }

function quickPanel(m,collapse){
  const q=el('div','quick');
  q.appendChild(standing(m));
  let value=m.usual!=null?m.usual:null;
  const presets=[50,100,200,500];
  if(m.usual!=null&&!presets.includes(m.usual)) presets[3]=m.usual;
  const grid=el('div','qamts'), btns=[];
  presets.forEach(v=>{
    const b=el('button','qa'+(v===value?' on':''),rs(v)); b.type='button'; b.dataset.v=v;
    if(v===m.usual) b.appendChild(el('i',null,'USUAL'));
    b.addEventListener('click',ev=>{ ev.stopPropagation(); value=v; paint(); });
    b.title='Press '+(presets.indexOf(v)+1);
    btns.push(b); grid.appendChild(b);
  });
  q.appendChild(grid);

  // amount is not the whole story - the date belongs here too
  let date=TODAY();
  const drow=el('div','qdate'), dbtn=[];
  [['Today',0],['Yesterday',-1]].forEach(function(pr){
    const b=el('button','dqb',pr[0]); b.type='button';
    b.addEventListener('click',ev=>{ ev.stopPropagation(); const d=new Date(); d.setDate(d.getDate()+pr[1]);
      date=d.toLocaleDateString('en-CA'); di.value=date; paint(); });
    dbtn.push([b,pr[1]]); drow.appendChild(b);
  });
  const oth=document.createElement('input');
  oth.type='number'; oth.inputMode='numeric'; oth.min='0';
  oth.className='qdi qnum'; oth.placeholder='Other';
  oth.addEventListener('click',ev=>ev.stopPropagation());
  oth.addEventListener('input',ev=>{
    ev.stopPropagation();
    value = oth.value===''?null:Number(oth.value);
    paint(true);
  });
  const qf=el('div','qfields');
  qf.appendChild(oth);

  const di=document.createElement('input');
  di.type='date'; di.className='qdi'; di.value=date; di.max=TODAY();
  di.addEventListener('click',ev=>ev.stopPropagation());
  di.addEventListener('change',ev=>{ ev.stopPropagation(); date=di.value||TODAY(); paint(); });
  qf.appendChild(di);
  q.appendChild(drow);
  q.appendChild(qf);

  const row=el('div','qgo');
  const go=el('button','go'); go.type='button';
  const more=el('button','more','⋯'); more.type='button'; more.title='Open the full record (F4)';
  more.addEventListener('click',ev=>{ ev.stopPropagation(); openMadrasa(m.id); });
  row.append(go,more); q.appendChild(row);

  function paint(skipOther){
    btns.forEach(b=>b.classList.toggle('on',value!=null&&Number(b.dataset.v)===value));
    if(!skipOther) oth.value=(value!=null&&presets.indexOf(value)<0)?value:'';
    dbtn.forEach(function(pr){ const d=new Date(); d.setDate(d.getDate()+pr[1]);
      pr[0].classList.toggle('on',date===d.toLocaleDateString('en-CA')); });
    go.disabled=!(value>0);
    go.textContent='';
    go.appendChild(document.createTextNode(value>0?('Save '+rs(value)+'  ·  '+dmy(date)):'Pick an amount'));
    if(value>0) go.appendChild(el('span','fk','F1'));
  }
  paint();
  q._save=()=>{
    if(!(value>0)) return false;
    const amt=value, id=m.id, when=date;
    const did=addDonation(id,amt,when);
    openRowId=null;
    toast('Saved '+rs(amt)+' · '+shortName(m.name),{actionLabel:'Undo',action:()=>{
      dropDonation(id,did); renderAll(); toast('Removed');
    }});
    renderAll();
    return true;
  };
  q._pick=i=>{ if(btns[i]){ value=Number(btns[i].dataset.v); paint(); } };
  go.addEventListener('click',ev=>{ ev.stopPropagation(); q._save(); });
  q.addEventListener('click',ev=>ev.stopPropagation());
  return q;
}

  custom.addEventListener('input',()=>{ value=custom.value===''?null:Number(custom.value); sync(true); });
  la.appendChild(custom);
  const ld=el('label','lb');
  const ldS=el('span',null,'Date given'); ldS.appendChild(el('span','fk','F2')); ld.appendChild(ldS);
  const di=document.createElement('input');
  di.type='date'; di.className='in'; di.value=date; di.max=TODAY();

  ld.appendChild(di);

  const q=el('div','dq'), qb=[];
  [['Today',0],['Yesterday',-1],['2 days ago',-2]].forEach(function(p){
    const b=el('button','dqb',p[0]); b.type='button';
    b.addEventListener('click',()=>{ const d=new Date(); d.setDate(d.getDate()+p[1]); date=d.toLocaleDateString('en-CA'); di.value=date; sync(); });
    qb.push([b,p[1]]); q.appendChild(b);

}

/* ================================================================
   Receipt reading - Tesseract runs here, on this device.
   ================================================================ */
let ocrWorker=null;
async function getWorker(onProgress){
  if(ocrWorker) return ocrWorker;
  if(typeof Tesseract==='undefined') throw new Error('The reading engine did not load');
  ocrWorker=await Tesseract.createWorker('eng',1,{
    workerPath:'vendor/worker.min.js',
    corePath:'vendor/',
    langPath:'vendor/',
    cacheMethod:'none',
    logger:m=>{ if(onProgress) onProgress(m); }
  });
  return ocrWorker;
}
function prepImage(file,maxDim){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,maxDim/Math.max(img.width,img.height));
      const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d',{willReadFrequently:true});
      x.drawImage(img,0,0,w,h);
      // grey + contrast stretch: these receipts are printed on strong colour
      const d=x.getImageData(0,0,w,h), p=d.data, hist=new Uint32Array(256);
      for(let i=0;i<p.length;i+=4){
        const g=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)|0;
        p[i]=p[i+1]=p[i+2]=g; hist[g]++;
      }
      let lo=0,hi=255,acc=0; const total=w*h, cut=total*0.02;
      for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>cut){ lo=i; break; } }
      acc=0;
      for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>cut){ hi=i; break; } }
      const span=Math.max(1,hi-lo);
      for(let i=0;i<p.length;i+=4){
        let g=(p[i]-lo)*255/span; g=g<0?0:g>255?255:g;
        p[i]=p[i+1]=p[i+2]=g;
      }
      x.putImageData(d,0,0);
      URL.revokeObjectURL(img.src);
      resolve(c);
    };
    img.onerror=()=>reject(new Error('That image could not be opened'));
    img.src=URL.createObjectURL(file);
  });
}
const NOISE=/A\/?C|IFSC|BANK|EMAIL|@|GMAIL|PAYTM|MOB|CELL|PRESS|GRAPHICS|BRANCH|CHEQUE|DRAFT|OFFSET|RUN BY|BOOK NO|SR\.? ?NO|AMOUNT|ACCOUNT|COLLECT|WELFARE CHARITABLE/i;
const KEY=/JAM[IE]A|JA ?MIA|MADRA|MADAR|DARUL|DAR[- ]?UL|MASJID|MAHAD|ISLAM|QURAN|ULOOM|ULUM|MADNI|TAMEER/i;
const PLACE=/DISTT?\b|\bP\.?\s?O\b|\bVIA\b|PIN\s*[-:]?\s*\d{6}|BIHAR|PRADESH|JHARKHAND|BENGAL|TELANGANA|MAHARASHTRA|NAGAR|PURA|GANJ/i;

/* v6 keeps lines under blocks > paragraphs > lines; data.lines is always empty */
function linesFrom(data){
  const out=[];
  (data.blocks||[]).forEach(b=>(b.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(l=>{
    const t=String(l.text||'').replace(/\s+/g,' ').trim();
    if(t) out.push({text:t, confidence:Number(l.confidence)||0});
  })));
  if(out.length) return out;
  const conf=Number(data.confidence)||0;
  return String(data.text||'').split(/\r?\n/)
    .map(t=>({text:t.replace(/\s+/g,' ').trim(), confidence:conf}))
    .filter(l=>l.text);
}

function extractReceipt(lines){
  const txt=lines.map(l=>l.text.replace(/\s+/g,' ').trim()).filter(Boolean);
  const blob=txt.join(' \n ');
  let regd='';
  let mm=blob.match(/Reg[a-z]*\.?\s*No\.?\s*[:\-.]?\s*([0-9]{2,}[0-9A-Z/\-]*)/i)
        || blob.match(/Regd\.?\s*[:\-]?\s*([0-9]{2,}[0-9A-Z/\-]*)/i);
  if(mm) regd=mm[1];
  else{
    for(let i=0;i<txt.length&&!regd;i++){
      if(!/Reg[a-z]*\.?\s*No/i.test(txt[i])) continue;
      for(let j=i;j<Math.min(i+3,txt.length);j++){
        const cand=(j===i)?txt[j].replace(/.*Reg[a-z]*\.?\s*No\.?\s*[:\-.]?/i,''):txt[j];
        const g=cand.trim().match(/^([0-9]{3,}[0-9A-Z/\-]*)$/)||cand.match(/\b([0-9]{3,}[0-9A-Z/\-]*)\b/);
        if(g&&!/^(19|20)\d{2}$/.test(g[1])){ regd=g[1]; break; }
      }
    }
  }
  const digits=blob.replace(/[^\d]/g,' ');
  const phones=digits.match(/\b[6-9]\d{9}\b/g);
  const phone=phones?phones[0]:'';
  let name=null,best=-1; const addr=[];
  lines.forEach(l=>{
    const c=l.text.replace(/\s+/g,' ').trim();
    if(c.length<8||NOISE.test(c)){ if(PLACE.test(c)&&c.length>10) addr.push(c); return; }
    if(PLACE.test(c)&&!KEY.test(c)){ addr.push(c); return; }
    const letters=c.replace(/[^A-Za-z]/g,'');
    if(!letters) return;
    const up=(c.replace(/[^A-Z]/g,'').length)/letters.length;
    let sc=up*40+Math.min(c.length,44)*0.8+(KEY.test(c)?35:0)+(l.confidence||0)/10;
    if(/\d{5,}/.test(c)) sc-=30;
    if(sc>best){ best=sc; name=c; }
  });
  if(name&&PLACE.test(name)) addr.push(name);
  const nm=(name||'').split(/,|\bP\.?\s?O\b|\bVia\b|\bDistt?\b|\bNear\b/i)[0].trim();
  return {regd:regd.trim(), name:nm, phone, address:addr.join(' ').replace(/\s+/g,' ').trim()};
}
function judge(found){
  const ra=atoks(found.address);
  let hits=found.regd?search(found.regd):[];
  if(!hits.length||hits[0].sc<860){
    const h2=found.name?search(found.name):[];
    if(h2.length&&(!hits.length||h2[0].sc>hits[0].sc)) hits=h2;
  }
  if(!hits.length) return {kind:'new',hits:[]};
  const top=hits[0];
  let shared=0; ra.forEach(w=>{ if(top.m._atok.has(w)) shared++; });
  if(top.why==='Regd No') return {kind:'match',hits,why:'the registration number'};
  if(shared>0) return {kind:'match',hits,why:'the name and address'};
  if(top.sc>=400) return {kind:'ask',hits,why:'same name, different place'};
  if(top.sc>=280) return {kind:'match',hits,why:'a close spelling'};
  return {kind:'new',hits:[]};
}

          else if(m.status) txt.textContent=String(m.status).replace(/^\w/,c=>c.toUpperCase())+'…';

      if(!data){
        holder.appendChild(noteBox('warn','⚠','Could not read that photo. ',String((err&&err.message)||err||'')+' You can still type the details in.'));

        holder.appendChild(b);
        const again=el('button','btn quiet','Try another photo'); again.type='button'; again.style.marginTop='9px';
        again.addEventListener('click',()=>{ inp.value=''; start(); });
        holder.appendChild(again);
        return;
      }

      const lines=linesFrom(data);
      const blob=lines.map(l=>l.text).join(' \n ');
      const hits=matchFromText(blob);
      const top=hits[0];
      const sure=!!(top&&(top.hard||top.w>=9));

      const v=el('div','verdict'); const vk=el('div','k'); const vm=el('div','m');
      if(sure){
        const m=top.m;
        v.classList.add(m.gave?'v-warn':'v-prev');
        vk.textContent=m.gave?'ALREADY GIVEN':'PREVIOUS';
        vm.appendChild(el('b',null,m.name));
        vm.appendChild(document.createTextNode(' — '+
          (m.gave?(rs(m.thisYearTotal)+' already recorded this year.')
                 :('given '+m.years.length+(m.years.length===1?' time':' times')+
                   (m.last?(', last '+rs(m.last.amount)+' on '+nice(m.last.date||(m.lastYear+'-01-01'))):'')+'.'))));
      }else{
        v.classList.add('v-new'); vk.textContent='NEW';
        vm.appendChild(document.createTextNode('Nothing in your register matches this receipt.'));
      }
      v.append(vk,vm); v.style.marginTop='13px'; holder.appendChild(v);

      if(hits.length){
        const c=panel(sure?'Record against this':'Closest in your register');
        hits.slice(0,sure?3:4).forEach(h=>{
          const b=el('button','cand'); b.type='button';
          b.appendChild(el('div','n',h.m.name));
          b.appendChild(el('div','a',[h.m.address,h.m.regd?('Regd '+h.m.regd):''].filter(Boolean).join('  ·  ')));
          const ev=h.hard?'matched the registration number'
                         :('matched on '+h.shared.slice(0,3).join(', ').toLowerCase());
          b.appendChild(el('div','h',(h.m.years.length
            ?('Given '+h.m.years.length+'× · last '+rs(h.m.lastAmount)+' in '+h.m.lastYear+' · ')
            :'No history yet · ')+ev));
          b.addEventListener('click',()=>{
            openRowId=h.m.id; renderAll();
            if(!wide()) close();
            openMadrasa(h.m.id);
          });
          c.appendChild(b);
        });
        holder.appendChild(c);
      }

      /* Adding as new: you choose which line is which. No guessing. */
      const add=el('button','btn'+(sure?'':' primary'),'＋  Add as a new madrasa');
      add.type='button'; add.style.marginTop='12px';
      add.addEventListener('click',()=>{ if(!wide()) close(); openNewFromLines(lines); });
      holder.appendChild(add);

      const again=el('button','btn quiet','Read another receipt'); again.type='button'; again.style.marginTop='9px';
      again.addEventListener('click',()=>{ inp.value=''; start(); });
      holder.appendChild(again);

      const raw=el('details'); raw.style.marginTop='12px';
      const sm=document.createElement('summary');
      sm.textContent='What the photo actually said';
      sm.style.cssText='font-size:12.5px;color:var(--muted);cursor:pointer;padding:6px 2px';
      raw.appendChild(sm);
      lines.forEach(l=>{ const d=el('div','ocrline',l.text); d.setAttribute('data-sel',''); raw.appendChild(d); });
      holder.appendChild(raw);
    });
  },{backTo:null});
}

/* Add from a photo: you tap which line is the name, the address, the Regd No.
   The app never decides that for you. */
function openNewFromLines(lines){
  const guess={name:'',address:'',regd:'',phone:''};
  const blob=lines.map(l=>l.text).join(' ');
  const rm=blob.match(/Reg[a-z]*\.?\s*No\.?\s*[:\-.]?\s*([0-9]{2,}[0-9A-Za-z/\-]*)/i);
  if(rm) guess.regd=rm[1];
  const ph=blob.replace(/[^0-9]/g,' ').split(' ').filter(t=>/^[6-9][0-9]{9}$/.test(t));
  if(ph.length) guess.phone=ph[0];

  screenOpen('New madrasa from photo',(body,close,ctx)=>{
    body.appendChild(noteBox('','☝','Tap a line below to use it. ',
      'Choose the field first, then tap the line from the receipt that belongs in it.'));

    const p=panel('Madrasa');
    const fName=field(p,'Name',guess.name);
    const fAddr=field(p,'Address',guess.address);
    const fRegd=field(p,'Regd No',guess.regd,'text',true);
    const fPhone=field(p,'Phone',guess.phone,'tel',true);
    body.appendChild(p);

    let target=fName;
    const tabs=el('div','dq'); tabs.style.padding='11px 0 0';
    const defs=[['Name',fName],['Address',fAddr],['Regd No',fRegd],['Phone',fPhone]];
    const tb=[];
    defs.forEach(function(d){
      const b=el('button','dqb',d[0]); b.type='button';
      b.addEventListener('click',()=>{ target=d[1]; tb.forEach(x=>x[0].classList.toggle('on',x[1]===target)); });
      tb.push([b,d[1]]); tabs.appendChild(b);
    });
    tb[0][0].classList.add('on');
    body.appendChild(tabs);

    const lp=panel('Lines read from the receipt');
    lines.forEach(l=>{
      const b=el('button','cand'); b.type='button';
      b.appendChild(el('div','n',l.text));
      b.addEventListener('click',()=>{
        target.value = target.value ? (target.value+' '+l.text) : l.text;
        target.dispatchEvent(new Event('input',{bubbles:true}));
        toast('Added to '+(tb.find(x=>x[1]===target)||[{textContent:'field'}])[0].textContent);
      });
      lp.appendChild(b);
    });
    body.appendChild(lp);

    const dup=el('div'); dup.style.marginTop='12px'; body.appendChild(dup);
    const go=el('button','btn primary'); go.type='button';
    const ap=panel('Amount given');
    const pick=picker(ap,{usual:null,onChange:()=>lab()});
    body.appendChild(ap);

    function checkDup(){
      dup.textContent='';
      const nm=fName.value.trim(), rg=fRegd.value.trim();
      if(nm.length<4&&rg.length<2) return;
      const hits=search(rg.length>2?rg:nm).slice(0,3);
      if(!hits.length) return;
      dup.appendChild(noteBox('warn','⚠','Similar entries already exist. ','Open one instead of adding a second copy.'));
      const c=el('div','panel'); c.style.marginTop='9px';
      hits.forEach(h=>{
        const b=el('button','cand'); b.type='button';
        b.appendChild(el('div','n',h.m.name));
        b.appendChild(el('div','a',h.m.address||''));
        b.addEventListener('click',()=>{ if(!wide()) close(); openMadrasa(h.m.id); });
        c.appendChild(b);
      });
      dup.appendChild(c);
    }
    let t=null;
    [fName,fRegd].forEach(i=>i.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(checkDup,260); lab(); }));

    function lab(){
      if(!go||!pick) return;
      const ok=fName.value.trim().length>1;
      go.disabled=!ok;
      go.textContent=!ok?'Tap the line that is the name':(pick.value>0?('Add as new · save '+rs(pick.value)):'Add as new madrasa');
    }
    lab();
    go.addEventListener('click',()=>{
      const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      patchMad(id,{name:fName.value.trim(),address:fAddr.value.trim(),regd:fRegd.value.trim(),phone:fPhone.value.trim()});
      const amt=pick.value;
      if(amt>0) addDonation(id,amt,pick.date);
      toast(amt>0?('Added as new · '+rs(amt)):'Added as new madrasa',{actionLabel:'Undo',action:()=>{
        dropMad(id); renderAll(); clearDetail(); toast('Removed');
      }});
      renderAll();
      if(!wide()) close();
      openMadrasa(id);
    });
    mountAction(ctx,go);
  },{backTo:null});
}

/* ---------- duplicates ---------- */
function openReview(){
  screenOpen('Possible duplicates',(body)=>{
    body.appendChild(noteBox('','⚇','Same madrasa written two ways? ','These look alike but sit at different addresses, so they were kept apart. You decide.'));
    const w=el('div'); w.style.marginTop='12px'; body.appendChild(w);
    function draw(){
      w.textContent='';
      const dec=REG.reviewDecisions||{};
      const open=(REG.reviewPairs||[]).filter(p=>!dec[p.a+'|'+p.b]&&MAD.some(m=>m.id===p.a)&&MAD.some(m=>m.id===p.b));
      if(!open.length){
        const b=el('div','blank');
        b.appendChild(el('div','t','All reviewed'));
        b.appendChild(el('div','s','Nothing left to decide.'));
        w.appendChild(b); return;
      }
      open.forEach(p=>{
        const A=MAD.find(m=>m.id===p.a), B=MAD.find(m=>m.id===p.b);
        const box=el('div','pair');
        [A,B].forEach(m=>{
          const s=el('div','ps');
          s.appendChild(el('div','n',m.name));
          s.appendChild(el('div','a',m.address||'—'));
          s.appendChild(el('div','y',m.years.join(', ')+'  ·  '+rs(m.total)+(m.regd?('  ·  Regd '+m.regd):'')));
          box.appendChild(s);
        });
        const a=el('div','pa');
        const yes=el('button','btn primary','Same — merge'); yes.type='button';
        const no=el('button','btn quiet','Different'); no.type='button';
        yes.addEventListener('click',()=>{
          patchMad(B.id,{mergedInto:A.id});
          REG.reviewDecisions[p.a+'|'+p.b]='merged'; touch();
          toast('Merged into '+shortName(A.name)); renderAll(); draw();
        });
        no.addEventListener('click',()=>{ REG.reviewDecisions[p.a+'|'+p.b]='separate'; touch(); draw(); });
        a.append(yes,no); box.appendChild(a); w.appendChild(box);
      });
    }
    draw();
  },{backTo:null});
}

function cell(v){ const s=String(v==null?'':v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function saveFile(name,text,mime){
  const u=URL.createObjectURL(new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'}));
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function exportCsv(){
  const rows=[['Date','Year','Name Of Madaris','Address','Amount','Regd No','Phone','Note','Source']];
  MAD.forEach(m=>m.donations.forEach(d=>rows.push([d.date?dmy(d.date):'',d.year,m.name,m.address,d.amount==null?'':d.amount,m.regd,m.phone,d.note||'',d.src==='app'?'Rashid':'RASHI.xlsx'])));
  saveFile('rashid-'+TODAY()+'.csv','﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv');
  toast('Exported '+(rows.length-1)+' rows');
}

/* ================================================================
   Report - any date range, the money, and every donation in it.
   ================================================================ */
let RP = LS.get('report', null) || {preset:'year', from:'', to:'', sort:'date'};

function allDonations(){
  const out=[];
  MAD.forEach(m=>m.donations.forEach(d=>{
    if(d.amount==null||d.amount==='') return;
    out.push({m:m, d:d, date:d.date||(d.year+'-01-01'), amount:Number(d.amount)});
  }));
  return out;
}
function rangeFor(preset){
  const iso=d=>d.toLocaleDateString('en-CA');
  if(preset==='year')   return [YEAR+'-01-01', TODAY()];
  if(preset==='last')   return [(YEAR-1)+'-01-01', (YEAR-1)+'-12-31'];
  if(preset==='season') return [YEAR+'-01-01', YEAR+'-04-30'];
  if(preset==='d30'){ const a=new Date(); a.setDate(a.getDate()-29); return [iso(a), TODAY()]; }
  if(preset==='d90'){ const a=new Date(); a.setDate(a.getDate()-89); return [iso(a), TODAY()]; }
  if(preset==='all'){
    const ds=allDonations().map(x=>x.date).sort();
    return [ds[0]||(YEAR+'-01-01'), ds[ds.length-1]||TODAY()];
  }
  return [RP.from||(YEAR+'-01-01'), RP.to||TODAY()];
}

function openReport(){
  screenOpen('Report',(body,close,ctx)=>{
    const head=el('div'); body.appendChild(head);
    const out=el('div'); body.appendChild(out);

    const presets=[['year','This year'],['last','Last year'],['season','Ramadan season'],
                   ['d30','Last 30 days'],['d90','Last 90 days'],['all','All time'],['custom','Custom']];
    const pr=el('div','rpresets'), pb=[];
    presets.forEach(function(x){
      const b=el('button','rp',x[1]); b.type='button';
      b.addEventListener('click',()=>{
        RP.preset=x[0];
        if(x[0]!=='custom'){ const r=rangeFor(x[0]); RP.from=r[0]; RP.to=r[1]; }
        LS.set('report',RP); draw();
      });
      pb.push([b,x[0]]); pr.appendChild(b);
    });
    head.appendChild(pr);

    const rr=el('div','rrange');
    const lf=el('label','lb'); lf.appendChild(el('span',null,'From'));
    const inF=document.createElement('input'); inF.type='date'; inF.className='in'; lf.appendChild(inF);
    const lt=el('label','lb'); lt.appendChild(el('span',null,'To'));
    const inT=document.createElement('input'); inT.type='date'; inT.className='in'; lt.appendChild(inT);
    rr.append(lf,lt); head.appendChild(rr);
    [inF,inT].forEach(i=>i.addEventListener('change',()=>{
      RP.preset='custom'; RP.from=inF.value; RP.to=inT.value; LS.set('report',RP); draw();
    }));

    function shiftBack(from,to){
      const a=new Date(from), b=new Date(to);
      const len=Math.round((b-a)/86400000)+1;
      const pb2=new Date(a); pb2.setDate(pb2.getDate()-1);
      const pa=new Date(pb2); pa.setDate(pa.getDate()-(len-1));
      return [pa.toLocaleDateString('en-CA'), pb2.toLocaleDateString('en-CA')];
    }

    /* one series over time: a column chart, no legend, one hue */
    function chart(keys,vals,labels,counts){
      const wrap=el('div','chartwrap');
      const W=680,H=190,padL=8,padR=8,padB=26,padT=18;
      const plotW=W-padL-padR, plotH=H-padT-padB;
      let peak=1; vals.forEach(v=>{ if(v>peak) peak=v; });
      const slot=plotW/keys.length;
      const bw=Math.min(46,Math.max(6,slot-8));
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 '+W+' '+H);
      svg.setAttribute('role','img');
      svg.setAttribute('aria-label','Given in each period');
      const mk=(t,a)=>{ const e=document.createElementNS('http://www.w3.org/2000/svg',t);
        for(const k in a) e.setAttribute(k,a[k]); return e; };
      // baseline only - grid stays recessive
      svg.appendChild(mk('line',{x1:padL,y1:padT+plotH,x2:W-padR,y2:padT+plotH,class:'cgrid'}));
      const tip=el('div','ctip');
      const peakIdx=vals.indexOf(peak);
      keys.forEach((k,i)=>{
        const v=vals[i];
        const h=Math.max(2,Math.round(v/peak*plotH));
        const x=padL+slot*i+(slot-bw)/2;
        const y=padT+plotH-h;
        const r=Math.min(4,bw/2,h);
        const d='M'+x+' '+(padT+plotH)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+
                'H'+(x+bw-r)+'Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)+'V'+(padT+plotH)+'Z';
        const bar=mk('path',{d:d,class:'cbar'});
        bar.style.cursor='default';
        function show(){
          bar.classList.add('hot');
          tip.textContent='';
          tip.appendChild(el('div',null,labels[i]));
          const b2=el('b',null,rs(v)); tip.appendChild(b2);
          tip.appendChild(document.createTextNode('  \u00B7  '+counts[i]+(counts[i]===1?' donation':' donations')));
          tip.style.left=((x+bw/2)/W*100)+'%';
          tip.style.top=(y/H*100)+'%';
          tip.classList.add('on');
        }
        function hide(){ bar.classList.remove('hot'); tip.classList.remove('on'); }
        bar.addEventListener('mouseenter',show);
        bar.addEventListener('mouseleave',hide);
        bar.addEventListener('touchstart',show,{passive:true});
        bar.addEventListener('touchend',hide);
        svg.appendChild(bar);
        svg.appendChild(mk('text',{x:x+bw/2,y:H-8,class:'clab','text-anchor':'middle'})).textContent=labels[i];
        // a value on the tallest only, never on every column
        if(i===peakIdx){
          svg.appendChild(mk('text',{x:x+bw/2,y:y-6,class:'cval','text-anchor':'middle'})).textContent=rs(v);
        }
      });
      wrap.appendChild(svg); wrap.appendChild(tip);
      return wrap;
    }

    function draw(){
      if(!RP.from||!RP.to){ const r0=rangeFor(RP.preset); RP.from=r0[0]; RP.to=r0[1]; }
      let from=RP.from, to=RP.to;
      if(from>to){ const t=from; from=to; to=t; }
      inF.value=from; inT.value=to;
      pb.forEach(function(x){ x[0].classList.toggle('on', x[1]===RP.preset); });

      const all=allDonations();
      const shown=all.filter(x=>x.date>=from&&x.date<=to);
      const total=shown.reduce((a,x)=>a+x.amount,0);
      const uniq=new Set(shown.map(x=>x.m.id)).size;
      const avg=shown.length?Math.round(total/shown.length):0;
      const prevR=shiftBack(from,to);
      const prevTotal=all.filter(x=>x.date>=prevR[0]&&x.date<=prevR[1]).reduce((a,x)=>a+x.amount,0);

      out.textContent='';

      const hd=el('div','rhead');
      const hero=el('div','rhero');
      hero.appendChild(el('div','amt',rs(total)));
      if(prevTotal>0){
        const pc=Math.round((total-prevTotal)/prevTotal*100);
        const cls=pc>0?'up':(pc<0?'down':'flat');
        hero.appendChild(el('div','delta '+cls,(pc>0?'\u25B2 ':(pc<0?'\u25BC ':''))+Math.abs(pc)+'%'));
      }
      hd.appendChild(hero);
      const days=Math.round((new Date(to)-new Date(from))/86400000)+1;
      const sub=el('div','rsub');
      sub.textContent=nice(from)+'  \u2192  '+nice(to)+'  \u00B7  '+days+(days===1?' day':' days')+
        (prevTotal>0?('  \u00B7  previous '+days+' days: '+rs(prevTotal)):'');
      hd.appendChild(sub);
      const st=el('div','rstats');
      [['Donations',String(shown.length)],['Madaris',String(uniq)],['Average',rs(avg)]].forEach(function(x){
        const d=el('div'); d.appendChild(el('div','k',x[0])); d.appendChild(el('div','v',x[1])); st.appendChild(d);
      });
      hd.appendChild(st);
      out.appendChild(hd);

      if(!shown.length){
        const bl=el('div','blank');
        bl.appendChild(el('div','t','Nothing in this range'));
        bl.appendChild(el('div','s','Pick a wider range, or a different one from the buttons above.'));
        out.appendChild(bl);
        addTools([],from,to);
        return;
      }

      const byYear=(new Date(to)-new Date(from))>86400000*420;
      const sums=new Map(), cnts=new Map();
      shown.forEach(x=>{
        const k=byYear?x.date.slice(0,4):x.date.slice(0,7);
        sums.set(k,(sums.get(k)||0)+x.amount);
        cnts.set(k,(cnts.get(k)||0)+1);
      });
      const keys=[...sums.keys()].sort();
      const labels=keys.map(k=>byYear?k:(MON[Number(k.slice(5,7))-1]+' '+k.slice(2,4)));
      const cp=panel(byYear?'Given each year':'Given each month',
                     keys.length+(keys.length===1?' period':' periods'));
      cp.appendChild(chart(keys,keys.map(k=>sums.get(k)),labels,keys.map(k=>cnts.get(k))));
      out.appendChild(cp);

      // who received the most in this range
      const perMad=new Map();
      shown.forEach(x=>{
        const e=perMad.get(x.m.id)||{m:x.m,amt:0,n:0};
        e.amt+=x.amount; e.n++; perMad.set(x.m.id,e);
      });
      const top=[...perMad.values()].sort((a,b)=>b.amt-a.amt).slice(0,5);
      if(top.length>1){
        const tp=panel('Largest in this range','top '+top.length);
        const peak2=top[0].amt||1;
        top.forEach(t=>{
          const r=el('div','toprow');
          const nm=el('div','tn',t.m.name);
          nm.appendChild(el('s',null,t.n+(t.n===1?' donation':' donations')+
            (t.m.regd?('  \u00B7  Regd '+t.m.regd):'')));
          r.appendChild(nm);
          r.appendChild(el('div','ta',rs(t.amt)));
          const bar=el('div','tb'); const fi=el('i');
          fi.style.width=Math.max(3,Math.round(t.amt/peak2*100))+'%';
          bar.appendChild(fi); r.appendChild(bar);
          tp.appendChild(r);
        });
        out.appendChild(tp);
      }

      // what you tend to give
      const mix=new Map();
      shown.forEach(x=>mix.set(x.amount,(mix.get(x.amount)||0)+1));
      const mixKeys=[...mix.keys()].sort((a,b)=>a-b);
      if(mixKeys.length>1){
        const mp=panel('Amounts you gave',mixKeys.length+' different');
        const mw=el('div','mix');
        mixKeys.forEach(k=>{
          const c=el('div','mixp');
          c.appendChild(el('div','k',rs(k)));
          c.appendChild(el('div','v',mix.get(k)+(mix.get(k)===1?' time':' times')));
          mw.appendChild(c);
        });
        mp.appendChild(mw); out.appendChild(mp);
      }

      const sorts=[['date','Newest'],['old','Oldest'],['amount','Largest'],['name','By name']];
      const lp=panel('Every donation',String(shown.length));
      const sr=el('div','sortrow');
      sorts.forEach(function(x){
        const b=el('button','dqb'+(RP.sort===x[0]?' on':''),x[1]); b.type='button';
        b.addEventListener('click',()=>{ RP.sort=x[0]; LS.set('report',RP); draw(); });
        sr.appendChild(b);
      });
      lp.appendChild(sr);
      const list=shown.slice();
      if(RP.sort==='date')   list.sort((a,b)=>b.date.localeCompare(a.date));
      if(RP.sort==='old')    list.sort((a,b)=>a.date.localeCompare(b.date));
      if(RP.sort==='amount') list.sort((a,b)=>b.amount-a.amount||b.date.localeCompare(a.date));
      if(RP.sort==='name')   list.sort((a,b)=>a.m.name.localeCompare(b.m.name)||a.date.localeCompare(b.date));
      list.forEach(x=>{
        const b=el('button','drow'); b.type='button';
        b.appendChild(el('div','dd',dmy(x.date)));
        const nm=el('div','dn',x.m.name);
        nm.appendChild(el('s',null,[x.m.address,x.m.regd?('Regd '+x.m.regd):''].filter(Boolean).join('  \u00B7  ')));
        b.appendChild(nm);
        b.appendChild(el('div','da',rs(x.amount)));
        b.addEventListener('click',()=>{ if(!wide()) close(); openMadrasa(x.m.id); });
        lp.appendChild(b);
      });
      out.appendChild(lp);
      addTools(list,from,to);
    }

    function addTools(list,from,to){
      const row=el('div','brow'); row.style.marginTop='12px';
      const ex=el('button','btn quiet','Export this range'); ex.type='button';
      ex.disabled=!list.length;
      ex.addEventListener('click',()=>{
        const rows=[['Date','Name Of Madaris','Address','Amount','Regd No','Phone','Note','Source']];
        list.forEach(x=>rows.push([dmy(x.date),x.m.name,x.m.address,x.amount,x.m.regd,x.m.phone,
                                   x.d.note||'',x.d.src==='app'?'Rashid':'RASHI.xlsx']));
        saveFile('rashid-'+from+'-to-'+to+'.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv');
        toast('Exported '+list.length+' donations');
      });
      const pt=el('button','btn quiet','Print'); pt.type='button';
      pt.addEventListener('click',()=>window.print());
      row.append(ex,pt); out.appendChild(row);

      const bk=el('button','btn quiet','Backup the whole register'); bk.type='button';
      bk.style.marginTop='9px';
      bk.addEventListener('click',()=>saveFile('rashid-register-'+TODAY()+'.json',JSON.stringify(REG,null,1),'application/json'));
      out.appendChild(bk);

      const dec=REG.reviewDecisions||{};
      const openPairs=(REG.reviewPairs||[]).filter(pp=>!dec[pp.a+'|'+pp.b]&&MAD.some(m=>m.id===pp.a)&&MAD.some(m=>m.id===pp.b)).length;
      const rv=el('button','btn quiet',openPairs?('Review '+openPairs+' possible duplicate'+(openPairs===1?'':'s')):'Duplicates \u2014 all reviewed');
      rv.type='button'; rv.style.marginTop='9px';
      rv.addEventListener('click',()=>{ close(); openReview(); });
      out.appendChild(rv);

      const lap=MAD.filter(m=>m.lapsed);
      if(lap.length){
        const lb=el('button','btn quiet','See the '+lap.length+' who have not given this year'); lb.type='button';
        lb.style.marginTop='9px';
        lb.addEventListener('click',()=>{ close(); $('#q').value=''; query=''; view='lapsed'; renderAll(); });
        out.appendChild(lb);
      }
    }

    draw();
  },{backTo:null});
}

/* ---------- sync ---------- */
function openSync(){
  screenOpen('Where your register is saved',(body,close)=>{
    const c=GH.cfg();
    body.appendChild(noteBox(c?'good':'',c?'✓':'⚇',
      c?('Syncing with '+c.owner+'/'+c.repo+'. '):'Saved on this device only. ',
      c?'Every change is pushed to that private repository, so your phone and computer stay in step.'
       :'Connect a private GitHub repository and this phone and your computer will share one register.'));
    const p=panel('Private GitHub repository');
    const fo=field(p,'GitHub username',(c&&c.owner)||'','text',true);
    const fr=field(p,'Repository name',(c&&c.repo)||'rashid-data','text',true);
    const ft=field(p,'Access token',(c&&c.token)||'','password',true);
    body.appendChild(p);
    body.appendChild(noteBox('','ℹ','The token stays in this browser. ','It is sent nowhere but GitHub. Make it a fine-grained token limited to that one repository, with Contents set to Read and write. You can revoke it any time.'));
    const row=el('div','brow'); row.style.marginTop='12px';
    const sv=el('button','btn primary','Connect and load'); sv.type='button';
    sv.addEventListener('click',async ()=>{
      const cfg={owner:fo.value.trim(),repo:fr.value.trim(),token:ft.value.trim(),path:'register.json',branch:'main'};
      if(!cfg.owner||!cfg.repo||!cfg.token){ toast('Fill all three boxes',{bad:true}); return; }
      sv.disabled=true; sv.textContent='Connecting…';
      GH.set(cfg);
      try{
        const r=await GH.pull();
        if(r.missing){ dirty=true; await pushNow(); toast('Created register.json in '+cfg.repo); }
        else{
          REG=(REG&&REG.madaris.length)?mergeReg(REG,r.data):r.data;
          REG.reviewDecisions=REG.reviewDecisions||{}; REG.reviewPairs=REG.reviewPairs||[];
          saveLocal(); reindex(); dirty=true; await pushNow();
          toast('Connected · '+MAD.length+' madaris');
        }
        showApp(); renderAll(); close();
      }catch(e){
        GH.clear(); toast(String(e.message||e),{bad:true});
        sv.disabled=false; sv.textContent='Connect and load';
      }
      syncBadge();
    });
    row.appendChild(sv);
    if(c){
      const off=el('button','btn quiet','Disconnect'); off.type='button';
      off.addEventListener('click',()=>{ GH.clear(); sha=null; toast('Disconnected'); syncBadge(); close(); });
      row.appendChild(off);
    }
    body.appendChild(row);
    const imp=el('button','btn quiet','Load a register file from this device'); imp.type='button'; imp.style.marginTop='9px';
    imp.addEventListener('click',()=>pickFile(close));
    body.appendChild(imp);
  },{backTo:null});
}
function pickFile(after){
  const i=document.createElement('input'); i.type='file'; i.accept='application/json,.json';
  i.addEventListener('change',async ()=>{
    const f=i.files&&i.files[0]; if(!f) return;
    try{
      const p=JSON.parse(await f.text());
      if(!p||!Array.isArray(p.madaris)) throw new Error('That file is not a Rashid register');
      REG=(REG&&REG.madaris.length)?mergeReg(REG,p):p;
      REG.reviewDecisions=REG.reviewDecisions||{}; REG.reviewPairs=REG.reviewPairs||[];
      saveLocal(); reindex(); dirty=true; schedulePush();
      toast('Loaded '+MAD.length+' madaris'); showApp(); renderAll();
      if(after) after();
    }catch(e){ toast(String(e.message||e),{bad:true}); }
  });
  i.click();
}

/* ---------- boot ---------- */
const emptyReg=()=>({version:1,updated:null,madaris:[],reviewPairs:[],reviewDecisions:{}});
function showApp(){
  if(REG&&REG.madaris.length){
    $('#boot').hidden=true; $('#app').hidden=false;
    if(wide()&&!selectedId) clearDetail();
  }
}
function setupScreen(){
  $('#bootMsg').innerHTML='Your register is not on this device yet.<br>Connect it once and it stays connected.';
  const b=$('#bootActs'); b.textContent='';
  const gh=el('button','btn primary','Connect your GitHub register'); gh.type='button';
  gh.addEventListener('click',()=>{ $('#boot').hidden=true; $('#app').hidden=false; openSync(); });
  const fl=el('button','btn quiet','Load register.json from this device'); fl.type='button';
  fl.addEventListener('click',()=>pickFile(null));
  b.append(gh,fl);
}
async function boot(){
  const th=LS.get('theme',null); if(th) document.documentElement.setAttribute('data-theme',th);
  REG=LS.get('register',null)||emptyReg();
  REG.reviewDecisions=REG.reviewDecisions||{}; REG.reviewPairs=REG.reviewPairs||[];
  reindex();
  if(MAD.length){ showApp(); renderAll(); }
  if(GH.cfg()){
    try{
      const r=await GH.pull();
      if(r.data){
        const mine=REG;
        REG=mine.madaris.length?mergeReg(mine,r.data):r.data;
        REG.reviewDecisions=REG.reviewDecisions||{}; REG.reviewPairs=REG.reviewPairs||[];
        saveLocal(); reindex();
        if(mine.madaris.length&&JSON.stringify(REG)!==JSON.stringify(mine)){ dirty=true; schedulePush(); }
      }
    }catch(e){ toast(String(e.message||e),{bad:true}); }
  }
  if(MAD.length){ showApp(); renderAll(); } else setupScreen();
  syncBadge();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- events ---------- */
let qt=null;
$('#q').addEventListener('input',e=>{
  query=e.target.value; $('#qx').hidden=!query;
  clearTimeout(qt); qt=setTimeout(renderAll,55);
});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const r=search(query);
    if(r.length) openMadrasa(r[0].m.id);
    else if(query.trim().length>=2) openNew({name:query.trim()});
  }
});
$('#qx').addEventListener('click',()=>{ $('#q').value=''; query=''; $('#qx').hidden=true; renderAll(); $('#q').focus(); });
$('#bNew').addEventListener('click',()=>openNew(query?{name:query.trim()}:{}));
$('#bPhoto').addEventListener('click',openPhoto);
$('#bStats').addEventListener('click',openReport);
$('#bSync').addEventListener('click',openSync);
$('#bKeys').addEventListener('click',openKeys);
$('#bTheme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  const next=cur==='dark'?'light':cur==='light'?'dark':(sysDark?'light':'dark');
  document.documentElement.setAttribute('data-theme',next); LS.set('theme',next);
});
function moveCursor(step){
  if(!VISIBLE.length) return;
  let i=VISIBLE.indexOf(cursorId);
  i = (i<0) ? (step>0?0:VISIBLE.length-1) : i+step;
  if(i<0) i=0;
  if(i>=VISIBLE.length) i=VISIBLE.length-1;
  cursorId=VISIBLE[i];
  renderList();
  const node=document.querySelector('.row.cursor');
  if(node&&node.scrollIntoView) node.scrollIntoView({block:'nearest'});
  if(wide()) openMadrasa(cursorId);
}
function openQuick(id){
  openRowId = (openRowId===id) ? null : id;
  renderList();
  const node=document.querySelector('.row.open');
  if(node&&node.scrollIntoView) node.scrollIntoView({block:'nearest'});
}
function currentQuick(){ return document.querySelector('.quick'); }

function openKeys(){
  screenOpen('Keyboard',(body)=>{
    const f=panel('Function keys','work everywhere');
    [['F1','Save what is in front of you'],['F2','Jump to the date'],['F3','Search'],
     ['F4','Open the full record, or start a new one'],['F6','Read a receipt photo'],
     ['F7','Report'],['F8','Type an amount'],['F9','This list']
    ].forEach(function(x){
      const r=el('div','khelp');
      r.appendChild(el('span','kbd',x[0]));
      r.appendChild(el('span',null,x[1]));
      f.appendChild(r);
    });
    body.appendChild(f);
    const p=panel('Letters');
    [['/','Jump to the search box'],['n','New madrasa'],['p','Read a receipt photo'],
     ['r','Report'],['Esc','Close, or clear the search'],['?','This list']
    ].forEach(function(x){
      const r=el('div','khelp');
      r.appendChild(el('span','kbd',x[0]));
      r.appendChild(el('span',null,x[1]));
      p.appendChild(r);
    });
    body.appendChild(p);
    const q=panel('In the list');
    [['\u2191 \u2193','Move between madaris'],['Enter','Open the quick entry on the highlighted one'],
     ['1 \u2013 4','Pick that amount'],['t / y','Set the date to today or yesterday'],
     ['Enter','Save once an amount is picked'],['o','Open the full record']
    ].forEach(function(x){
      const r=el('div','khelp');
      r.appendChild(el('span','kbd',x[0]));
      r.appendChild(el('span',null,x[1]));
      q.appendChild(r);
    });
    body.appendChild(q);
    body.appendChild(noteBox('','\u2139','Typing anywhere goes to the search box. ',
      'So you can start typing a name straight away without reaching for the mouse.'));
  },{backTo:null});
}

/* The F-keys work the same everywhere, the way a billing counter expects:
   F1 save, F2 date, F3 search, F4 open, F6 photo, F7 report, F8 amount, F9 help.
   They fire even while a field has focus. */
function primaryButton(){
  const host=document.querySelector('.sheet')||document.querySelector('#detail');
  if(host){
    const b=host.querySelector('.act .btn.primary, .act .btn');
    if(b && !b.disabled) return b;
  }
  const q=document.querySelector('.quick .qgo .go');
  return (q && !q.disabled) ? q : null;
}
function dateField(){
  // whatever is expanded in the list is what the user is looking at
  const q=document.querySelector('.quick input[type=date]');
  if(q) return q;
  const host=document.querySelector('.sheet')||document.querySelector('#detail');
  return host?host.querySelector('input[type=date]'):null;
}
function amountField(){
  const q=document.querySelector('.quick input[type=number]');
  if(q) return q;
  const host=document.querySelector('.sheet')||document.querySelector('#detail');
  return host?host.querySelector('input[type=number]'):null;
}
function handleFKey(e){
  const k=e.key;
  if(k==='F1'){
    e.preventDefault();
    const q=document.querySelector('.quick');
    if(q&&q._save&&document.activeElement!==amountField()){ if(q._save()) cursorId=null; return true; }
    const b=primaryButton(); if(b){ b.click(); return true; }
    return true;
  }
  if(k==='F2'){
    e.preventDefault();
    const d=dateField();
    if(d){ d.focus(); if(d.showPicker) try{ d.showPicker(); }catch(err){} }
    return true;
  }
  if(k==='F3'){ e.preventDefault(); $('#q').focus(); $('#q').select(); return true; }
  if(k==='F4'){
    e.preventDefault();
    if(openRowId) openMadrasa(openRowId); else openNew({});
    return true;
  }
  if(k==='F6'){ e.preventDefault(); openPhoto(); return true; }
  if(k==='F7'){ e.preventDefault(); openReport(); return true; }
  if(k==='F8'){
    e.preventDefault();
    const a=amountField(); if(a){ a.focus(); a.select&&a.select(); }
    return true;
  }
  if(k==='F9'){ e.preventDefault(); openKeys(); return true; }
  return false;
}

document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  const tag=ae&&ae.tagName;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tag||'');

  if(/^F[0-9]+$/.test(e.key)){ if(handleFKey(e)) return; }

  if(e.key==='Escape'){
    if(typing && ae.id==='q'){ ae.value=''; query=''; $('#qx').hidden=true; renderAll(); ae.blur(); e.preventDefault(); return; }
    if(openRowId){ openRowId=null; renderList(); e.preventDefault(); return; }
  }
  if(typing){
    if(e.key==='ArrowDown' && ae.id==='q'){ e.preventDefault(); ae.blur(); moveCursor(1); }
    if(e.key==='Enter' && ae.id==='q'){
      const r=search(query);
      if(r.length){ e.preventDefault(); cursorId=r[0].m.id; renderList(); openQuick(r[0].m.id); ae.blur(); }
    }
    return;
  }

  // a full screen is open on the phone: leave every key alone but Escape
  if(!wide() && document.querySelector('.sheet')) return;

  const q=currentQuick();
  if(q){
    if(e.key>='1'&&e.key<='4'){ e.preventDefault(); q._pick(Number(e.key)-1); return; }
    if(e.key==='Enter'){ e.preventDefault(); if(q._save()) cursorId=null; return; }
    if(e.key==='t'||e.key==='y'){
      e.preventDefault();
      const b=[...q.querySelectorAll('.qdate .dqb')][e.key==='t'?0:1];
      if(b) b.click();
      return;
    }
    if(e.key==='o'){ e.preventDefault(); openMadrasa(openRowId); return; }
  }

  if(e.key==='ArrowDown'){ e.preventDefault(); moveCursor(1); return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); moveCursor(-1); return; }
  if(e.key==='Enter'&&cursorId){ e.preventDefault(); openQuick(cursorId); return; }
  if(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key==='f')){ e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='n'){ e.preventDefault(); openNew({}); return; }
  if(e.key==='p'){ e.preventDefault(); openPhoto(); return; }
  if(e.key==='r'){ e.preventDefault(); openReport(); return; }
  if(e.key==='?'){ e.preventDefault(); openKeys(); return; }
  // any other plain letter starts a search
  if(e.key.length===1&&/[a-z0-9]/i.test(e.key)){
    $('#q').focus(); $('#q').value=e.key; query=e.key; $('#qx').hidden=false; renderAll();
    e.preventDefault();
  }
});
window.addEventListener('beforeunload',e=>{ if(dirty&&GH.cfg()){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('online',()=>{ if(dirty) pushNow(); });
matchMedia('(min-width:940px)').addEventListener('change',()=>{
  $('#sheets').textContent='';
  if(wide()){ if(selectedId) openMadrasa(selectedId); else clearDetail(); }
});
document.addEventListener('gesturestart',e=>e.preventDefault());

boot();
})();
</script>
