<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rashid Register</title>
<meta name="description" content="Madaris donation register - look up any madrasa, see every year you have given, record a new donation.">
<meta name="theme-color" content="#F2F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rashid">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ===================== tokens ===================== */
:root{
  --ground:#F2F4F2; --surface:#FFFFFF; --sunk:#EDF0EE; --hover:#F6F8F6;
  --ink:#141917; --ink2:#48524D; --muted:#79837D; --faint:#A6AEA9;
  --hair:#E5E9E6; --hair2:#D4DAD6;
  --accent:#0F7A57; --accent-ink:#0B6146; --accent-soft:#E1F2EA; --accent-line:#9FD5BF;
  --amber:#96640F; --amber-soft:#FAEFDC; --amber-line:#E3C489;
  --sky:#2C5BA4; --sky-soft:#E7EDF8; --sky-line:#AFC3E6;
  --danger:#AE3A2A; --danger-soft:#FAE7E3;
  --sh1:0 1px 2px rgba(20,25,23,.055);
  --sh2:0 1px 2px rgba(20,25,23,.05), 0 8px 22px -14px rgba(20,25,23,.22);
  --sh3:0 -1px 0 var(--hair), 0 -14px 28px -22px rgba(20,25,23,.3);
  --r1:10px; --r2:14px; --r3:18px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0F1311; --surface:#181D1A; --sunk:#141917; --hover:#1E2420;
  --ink:#E5EAE7; --ink2:#ADB7B2; --muted:#88928D; --faint:#616A65;
  --hair:#242A27; --hair2:#333B37;
  --accent:#41BC8B; --accent-ink:#67D3A6; --accent-soft:#122C21; --accent-line:#245A44;
  --amber:#D7A443; --amber-soft:#2B2310; --amber-line:#5A4620;
  --sky:#84A6E2; --sky-soft:#192134; --sky-line:#2E3D5C;
  --danger:#E07E68; --danger-soft:#301913;
  --sh1:0 1px 2px rgba(0,0,0,.32);
  --sh2:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.75);
  --sh3:0 -1px 0 var(--hair), 0 -14px 30px -22px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#0F1311; --surface:#181D1A; --sunk:#141917; --hover:#1E2420;
  --ink:#E5EAE7; --ink2:#ADB7B2; --muted:#88928D; --faint:#616A65;
  --hair:#242A27; --hair2:#333B37;
  --accent:#41BC8B; --accent-ink:#67D3A6; --accent-soft:#122C21; --accent-line:#245A44;
  --amber:#D7A443; --amber-soft:#2B2310; --amber-line:#5A4620;
  --sky:#84A6E2; --sky-soft:#192134; --sky-line:#2E3D5C;
  --danger:#E07E68; --danger-soft:#301913;
  --sh1:0 1px 2px rgba(0,0,0,.32);
  --sh2:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.75);
  --sh3:0 -1px 0 var(--hair), 0 -14px 30px -22px rgba(0,0,0,.8);
}

/* ===================== base / shell ===================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
}
input,textarea,[data-sel]{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer;color:inherit;touch-action:manipulation}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
:focus:not(:focus-visible){outline:none}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--hair2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-track{background:transparent}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}

#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.side{display:flex;flex-direction:column;min-height:0;flex:1;background:var(--ground)}
.detail{display:none}
@media (min-width:940px){
  #app{flex-direction:row}
  .side{flex:0 0 424px;max-width:424px;border-right:1px solid var(--hair)}
  .detail{display:flex;flex-direction:column;flex:1;min-width:0;background:var(--sunk)}
  .dock{display:none!important}
}

/* ===================== header ===================== */
.hd{padding:14px 16px 0;flex:none}
.hdrow{display:flex;align-items:center;gap:10px;padding-bottom:11px}
.mark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17.5px;letter-spacing:.17em}
.sub{font-size:12px;color:var(--faint);white-space:nowrap}
@media (max-width:400px){ .sub{display:none} }
.hdrow .sp{margin-left:auto}
.ib{
  height:36px;min-width:36px;padding:0 10px;border-radius:10px;background:var(--surface);
  box-shadow:var(--sh1);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;flex:none;
}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.ib .dot.ok{background:var(--accent)} .ib .dot.busy{background:var(--amber)}

.sb{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;margin-bottom:11px;
  background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1)}
.sb:focus-within{box-shadow:0 0 0 2.5px var(--accent),var(--sh1)}
.sb svg{flex:none;color:var(--faint)}
#q{flex:1;min-width:0;border:none;background:none;outline:none;font-size:16px}
#q::placeholder{color:var(--faint)}
.qx{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--faint);font-size:14px;flex:none}
.qx:hover{background:var(--sunk);color:var(--danger)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-bottom:12px}
.tile{background:var(--surface);border-radius:var(--r1);padding:9px 4px 10px;text-align:center;box-shadow:var(--sh1)}
.tile:hover{background:var(--hover)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent),var(--sh1)}
.tile b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16.5px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.022em}
.tile s{display:block;text-decoration:none;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.tile b.c-ink{color:var(--ink)} .tile b.c-sky{color:var(--sky)}
.tile b.c-amber{color:var(--amber)} .tile b.c-accent{color:var(--accent-ink)}

/* ===================== list ===================== */
.listwrap{flex:1;min-height:0;padding:0 16px}
.sec{display:flex;align-items:baseline;gap:10px;padding:4px 2px 8px}
.sec .c{margin-left:auto;font-size:12px;color:var(--faint)}
.rows{display:flex;flex-direction:column;gap:6px;padding-bottom:20px}

.row{width:100%;text-align:left;display:block;position:relative;overflow:hidden;
  background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1);padding:12px 14px 11px 16px}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--hair2)}
.row.s-given::before{background:var(--accent)}
.row.s-lapsed::before{background:var(--amber)}
.row.s-regular::before{background:var(--sky)}
.row:hover{background:var(--hover)}
.row.sel{box-shadow:0 0 0 2px var(--accent),var(--sh1)}
.rtop{display:flex;gap:11px;align-items:flex-start}
.rname{flex:1;min-width:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14.5px;line-height:1.3;letter-spacing:-.012em}
.ramt{flex:none;text-align:right}
.ramt b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block}
.ramt s{display:block;text-decoration:none;font-size:10px;color:var(--faint);margin-top:1px}
.raddr{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.38}
.rfoot{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}

.tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:2.5px 8px;border-radius:99px;white-space:nowrap}
.t-given{background:var(--accent-soft);color:var(--accent-ink)}
.t-lapsed{background:var(--amber-soft);color:var(--amber)}
.t-regular{background:var(--sky-soft);color:var(--sky)}
.t-new{background:var(--sky-soft);color:var(--sky)}
.t-quiet{background:var(--sunk);color:var(--muted)}
.rn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2.5px 7px;border-radius:6px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.yrs{display:flex;gap:3px;margin-left:auto}
.yr{width:25px;height:18px;border-radius:5px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:9.5px;background:var(--sunk);color:var(--faint)}
.yr.on{background:var(--accent-soft);color:var(--accent-ink)}

.addnew{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1);
  border:1.5px dashed var(--sky-line);text-align:left}
.addnew:hover{background:var(--sky-soft)}
.addnew .plus{width:34px;height:34px;border-radius:10px;background:var(--sky-soft);color:var(--sky);
  display:grid;place-items:center;font-size:18px;flex:none;font-weight:600}
.addnew .tx{min-width:0}
.addnew .t1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;line-height:1.25}
.addnew .t2{font-size:12px;color:var(--muted);margin-top:2px}

.blank{padding:44px 20px;text-align:center}
.blank .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16.5px;margin-bottom:5px}
.blank .s{color:var(--muted);font-size:13.5px;max-width:32ch;margin:0 auto;line-height:1.5}

.dock{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--ground);box-shadow:var(--sh3);display:flex;gap:9px}

/* ===================== buttons ===================== */
.btn{width:100%;height:50px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;
  gap:8px;font-size:14.5px;font-weight:600;background:var(--surface);color:var(--ink);box-shadow:var(--sh2);
  transition:transform .09s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:var(--sh1)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.quiet{background:var(--sunk);box-shadow:none;color:var(--ink2);height:46px;font-size:14px}
.btn.quiet:hover{background:var(--hair)}
.btn.danger{background:var(--danger-soft);color:var(--danger);box-shadow:none;height:46px;font-size:14px}
.brow{display:flex;gap:9px}
.brow>.btn{flex:1 1 0;min-width:0}

/* ===================== detail / sheet ===================== */
.sheet{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;flex-direction:column;
  animation:up .19s cubic-bezier(.2,.75,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.bar{flex:none;display:flex;align-items:center;gap:8px;background:var(--ground);
  padding:calc(9px + env(safe-area-inset-top)) 10px 9px;border-bottom:1px solid var(--hair)}
.bar h2{flex:1;min-width:0;margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:15px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.bk{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);font-size:20px;flex:none}
.bk:hover{background:var(--sunk);color:var(--ink)}
.body{flex:1;min-height:0;padding:16px}
@media (min-width:940px){
  .detail .bar{background:var(--sunk)}
  .detail .body{padding:20px 22px 26px}
  .inner{max-width:620px}
}
.dempty{flex:1;display:grid;place-items:center;padding:40px;text-align:center}
.dempty .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;margin-bottom:6px;color:var(--ink2)}
.dempty .s{color:var(--muted);font-size:14px;max-width:30ch;line-height:1.55}

.tt{margin-bottom:14px}
.tt h1{margin:0 0 6px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:23px;
  line-height:1.18;letter-spacing:-.024em;text-wrap:balance}
.tt .ad{color:var(--ink2);font-size:13.5px;line-height:1.45}
.tt .ids{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}

.verdict{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:var(--r2);margin-bottom:13px}
.verdict .k{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:11px;letter-spacing:.14em;
  padding:5px 10px;border-radius:7px;flex:none}
.verdict .m{font-size:13.5px;line-height:1.45;min-width:0}
.verdict .m b{font-weight:600}
.v-prev{background:var(--accent-soft);color:var(--accent-ink)} .v-prev .k{background:var(--accent);color:#fff}
.v-new{background:var(--sky-soft);color:var(--sky)} .v-new .k{background:var(--sky);color:#fff}
.v-warn{background:var(--amber-soft);color:var(--amber)} .v-warn .k{background:var(--amber);color:#fff}

.panel{background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1);overflow:hidden}
.panel+.panel,.panel+.btn,.btn+.panel,.panel+.brow,.note+.panel,.brow+.panel{margin-top:12px}
.ph{display:flex;align-items:center;gap:9px;padding:12px 15px 10px}
.ph .r{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none}

.hrow{display:grid;grid-template-columns:42px 1fr auto 12px;align-items:center;gap:11px;
  padding:11px 15px;width:100%;text-align:left;border-top:1px solid var(--hair)}
.hrow:hover{background:var(--hover)}
.hrow .y{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted)}
.hrow .bar2{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:6px}
.hrow .bar2 i{display:block;height:100%;background:var(--accent-line);border-radius:99px}
.hrow .a{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14.5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.018em;text-align:right}
.hrow .w{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right;margin-top:1px}
.hrow .ch{font-size:14px;color:var(--hair2)}
.hrow:hover .ch{color:var(--muted)}
.hrow.none{background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--sunk) 5px,var(--sunk) 10px)}
.hrow.none .y,.hrow.none .ms{color:var(--faint)}
.hrow.none .ms{font-size:12.5px}
.hrow.none .a{color:var(--amber);font-weight:600;font-size:12.5px}
.hrow.none .ch{visibility:hidden}
.hrow.now{background:var(--accent-soft)}
.hrow.now .a{color:var(--accent-ink)}
.hrow.now .bar2 i{background:var(--accent)}

.sum{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hair)}
.sum div{padding:12px 10px;text-align:center}
.sum div+div{border-left:1px solid var(--hair)}
.sum .k{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sum .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.024em}

.amts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:3px 15px 0}
.ac{position:relative;min-width:0}
.am{width:100%;height:52px;border-radius:12px;background:var(--sunk);
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15.5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center}
.am:hover{background:var(--hair)}
.am.on{background:var(--accent);color:#fff}
.ac .flag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:700;
  letter-spacing:.08em;background:var(--amber);color:#fff;padding:2px 6px;border-radius:99px;
  pointer-events:none;white-space:nowrap}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 15px 0}
.lb>span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:0 0 5px 3px}
.lb:focus-within>span{color:var(--accent)}
.in{width:100%;height:50px;border-radius:12px;background:var(--sunk);padding:0 12px;border:none;outline:none;font-size:16px}
.in:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.in.big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.dq{display:flex;gap:6px;padding:9px 15px 14px;flex-wrap:wrap}
.dqb{height:33px;padding:0 12px;border-radius:99px;background:var(--sunk);font-size:12.5px;font-weight:500;color:var(--ink2)}
.dqb:hover{background:var(--hair)}
.dqb.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

.fl{padding:11px 15px;border-top:1px solid var(--hair)}
.fl:first-child{border-top:none}
.fl>span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.fl input,.fl textarea{width:100%;border:none;background:none;outline:none;font-size:16px;padding:0}
.fl textarea{resize:vertical;min-height:44px;line-height:1.45}
.fl:focus-within>span{color:var(--accent)}
.fl.mono input{font-family:"IBM Plex Mono",monospace;font-size:15px}

.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r2);background:var(--surface);
  box-shadow:var(--sh1);font-size:13px;line-height:1.5;color:var(--ink2)}
.note+.note{margin-top:9px}
.note .i{flex:none}
.note b{color:var(--ink);font-weight:600}
.note.warn{background:var(--amber-soft);box-shadow:none;color:var(--amber)} .note.warn b{color:var(--amber)}
.note.good{background:var(--accent-soft);box-shadow:none;color:var(--accent-ink)} .note.good b{color:var(--accent-ink)}
.note.sky{background:var(--sky-soft);box-shadow:none;color:var(--sky)} .note.sky b{color:var(--sky)}

.cand{width:100%;text-align:left;padding:12px 15px;border-top:1px solid var(--hair)}
.cand:first-of-type{border-top:none}
.cand:hover{background:var(--hover)}
.cand .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;line-height:1.28}
.cand .a{font-size:12.5px;color:var(--muted);margin-top:2px}
.cand .h{font-size:12px;color:var(--accent-ink);font-weight:500;margin-top:4px}

.pair{background:var(--surface);border-radius:var(--r2);box-shadow:var(--sh1);overflow:hidden}
.pair+.pair{margin-top:10px}
.ps{padding:12px 15px}
.ps+.ps{border-top:1px dashed var(--hair2)}
.ps .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13.5px}
.ps .a{font-size:12.5px;color:var(--muted);margin-top:2px}
.ps .y{font-size:11.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.pa{display:flex;gap:8px;padding:11px 15px 13px;border-top:1px solid var(--hair)}
.pa .btn{height:42px;font-size:13.5px}

<body>

  <aside class="side">
    <div class="hd">
      <div class="hdrow">

</div>

  <div class="mk">RASHID</div>

  <div class="acts" id="bootActs"></div>

<div id="sheets"></div>
<div id="toasts"></div>

<script>
"use strict";
(function(){
/* ================================================================
   Rashid Register - a static page. Your data goes nowhere except the
   private GitHub repository you point it at yourself.
   ================================================================ */
const $  = s => document.querySelector(s);
const el = (t,c,x)=>{ const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
const YEAR  = new Date().getFullYear();
const TODAY = () => new Date().toLocaleDateString('en-CA');
const rs  = n => '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const dmy = d => d ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4) : '';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice = d => d ? (Number(d.slice(8,10))+' '+MON[Number(d.slice(5,7))-1]+' '+d.slice(0,4)) : '';
const wide = () => window.matchMedia('(min-width:940px)').matches;

const LS = {
  get(k,d){ try{ const v=localStorage.getItem('rashid.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('rashid.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('rashid.'+k); }catch(e){} }
};

let REG=null, MAD=[], sha=null, dirty=false, pushing=false, pushTimer=null;
let query='', view='recent', selectedId=null;

const GEO={UP:'UTTAR PRADESH',TS:'TELANGANA',WB:'WEST BENGAL',BIHARR:'BIHAR',JHANRKHAND:'JHARKHAND',JHARKAND:'JHARKHAND',HYDRABAD:'HYDERABAD',BANGAL:'BENGAL'};
function nrm(s){
  s=String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9 ]/g,' ')
   .replace(/\bMAD(?:AR|R)ASS?A\b|\bMADARSA\b|\bMADRSA\b/g,'MADRASA')
   .replace(/\bUL(?:U|O)O?M\b/g,'ULOOM').replace(/\bQURAAN\b/g,'QURAN');
  for(const k in GEO) s=s.replace(new RegExp('\\b'+k+'\\b','g'),GEO[k]);
  return s.replace(/\s+/g,' ').trim();
}
function nregd(s){
  const t=String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9/\-]/g,'').replace(/-/g,'/').replace(/\/+/g,'/');
  return t.replace(/^\/|\/$/g,'');
}
const nphone=s=>String(s==null?'':s).replace(/\D/g,'').slice(-10);
function bgs(s){ s=String(s).replace(/ /g,''); const o=new Set(); for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2)); return o; }
function dice(a,b){ if(!a.size||!b.size)return 0; let h=0; a.forEach(g=>{if(b.has(g))h++;}); return 2*h/(a.size+b.size); }
function donId(m,d,i){ return d.id || (m.id+':'+d.year+':'+i); }

function reindex(){
  MAD=[];
  const byId=new Map(REG.madaris.map(m=>[m.id,m]));
  const folded=new Map();
  REG.madaris.forEach(m=>{
    if(!m.mergedInto) return;
    const t=byId.get(m.mergedInto); if(!t||t.mergedInto) return;
    if(!folded.has(t.id)) folded.set(t.id,[]);
    folded.get(t.id).push(m);
  });
  REG.madaris.filter(s=>!s.mergedInto && !s.deleted).forEach(src=>{
    const m=Object.assign({},src);
    m.altNames=(src.altNames||[]).slice(); m.altAddresses=(src.altAddresses||[]).slice(); m.altRegds=(src.altRegds||[]).slice();
    m.donations=(src.donations||[]).map((d,i)=>Object.assign({},d,{id:donId(src,d,i)}));
    (folded.get(src.id)||[]).forEach(g=>{
      (g.donations||[]).forEach((d,i)=>m.donations.push(Object.assign({},d,{id:donId(g,d,i)})));
      if(g.name&&g.name!==m.name) m.altNames.push(g.name);
      if(g.address&&g.address!==m.address) m.altAddresses.push(g.address);
      if(g.regd&&g.regd!==m.regd) m.altRegds.push(g.regd);
      if(!m.phone&&g.phone) m.phone=g.phone;
    });
    m.altNames=[...new Set(m.altNames)]; m.altAddresses=[...new Set(m.altAddresses)]; m.altRegds=[...new Set(m.altRegds)];
    m.donations.sort((a,b)=>(a.date||String(a.year)).localeCompare(b.date||String(b.year)));
    const paid=m.donations.filter(d=>d.amount!=null&&d.amount!=='');
    m.total=paid.reduce((s,d)=>s+Number(d.amount),0);
    m.years=[...new Set(m.donations.map(d=>Number(d.year)))].sort();
    m.lastYear=m.years.length?m.years[m.years.length-1]:null;
    m.last=paid.length?paid[paid.length-1]:null;
    m.lastAmount=m.last?Number(m.last.amount):null;
    m.thisYear=m.donations.filter(d=>Number(d.year)===YEAR);
    m.thisYearTotal=m.thisYear.reduce((s,d)=>s+Number(d.amount||0),0);
    m.gave=m.thisYear.some(d=>d.amount!=null&&d.amount!=='');
    m.priorYears=m.years.filter(y=>y<YEAR).length;
    const tally={}; paid.forEach(d=>{tally[d.amount]=(tally[d.amount]||0)+1;});
    m.usual=paid.length?Number(Object.keys(tally).sort((a,b)=>tally[b]-tally[a]||Number(b)-Number(a))[0]):null;
    m.peak=paid.length?Math.max(...paid.map(d=>Number(d.amount))):0;
    m.isNew=m.years.length===0;
    m.status=m.gave?'given':(m.lastYear===YEAR-1?'lapsed':(m.priorYears>=3?'regular':(m.years.length?'quiet':'new')));
    m.regular=m.priorYears>=3;
    const names=[m.name].concat(m.altNames).filter(Boolean);
    const addrs=[m.address].concat(m.altAddresses).filter(Boolean);
    m._n=nrm(names.join(' ')); m._bgv=names.map(v=>bgs(nrm(v)));
    m._tok=new Set((m._n+' '+nrm(addrs.join(' '))).split(' ').filter(w=>w.length>1));
    m._r=[m.regd].concat(m.altRegds).map(nregd).filter(Boolean);
    m._p=nphone(m.phone);
    MAD.push(m);
  });
  MAD.sort((a,b)=>a.name.localeCompare(b.name));
}

function search(rawq){
  const qq=String(rawq||'').trim(); if(!qq) return [];
  const qr=nregd(qq), qp=nphone(qq), qn=nrm(qq);
  const terms=qn.split(' ').filter(Boolean), qbg=bgs(qn), out=[];
  for(const m of MAD){
    let sc=0, why='';
    if(qr.length>=2) for(const r of m._r){
      if(r===qr){sc=Math.max(sc,1000);why='Regd No';}
      else if(qr.length>=3&&r.startsWith(qr)){sc=Math.max(sc,900);why='Regd No';}
      else if(qr.length>=4&&r.includes(qr)){sc=Math.max(sc,860);why='Regd No';}
    }
    if(qp.length>=4&&m._p&&m._p.includes(qp)){sc=Math.max(sc,950);why='Phone';}
    if(terms.length){
      let ok=true,tot=0;
      for(const t of terms){
        let b=0;
        for(const w of m._tok){
          if(w===t)b=Math.max(b,10); else if(w.startsWith(t))b=Math.max(b,8);
          else if(t.length>=4&&w.includes(t))b=Math.max(b,5);
        }
        if(!b){ok=false;break;} tot+=b;
      }
      if(ok){ let s=300+tot*8; if(m._n.startsWith(qn))s+=160; if(s>sc) sc=s; }
    }
    if(sc===0&&qn.length>=4){
      let d=0; for(const v of m._bgv) d=Math.max(d,dice(qbg,v));
      if(d>=0.55){ sc=Math.round(d*520); why='Close spelling'; }
    }
    if(sc>0) out.push({m,sc,why});
  }
  out.sort((a,b)=>b.sc-a.sc||b.m.total-a.m.total||a.m.name.localeCompare(b.m.name));
  return out.slice(0,60);
}

/* ---------- persistence ---------- */
function saveLocal(){ LS.set('register',REG); }
function touch(){ REG.updated=new Date().toISOString(); saveLocal(); reindex(); dirty=true; schedulePush(); }

const GH={
  cfg(){ return LS.get('gh',null); }, set(c){ LS.set('gh',c); }, clear(){ LS.del('gh'); },
  path(){ const c=this.cfg(); return '/repos/'+c.owner+'/'+c.repo+'/contents/'+(c.path||'register.json'); },
  api(p,o){
    const c=this.cfg();
    return fetch('https://api.github.com'+p, Object.assign({},o,{headers:Object.assign({
      'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'
    },(o&&o.headers)||{})}));
  },
  async pull(){
    const r=await this.api(this.path()+'?ref='+encodeURIComponent(this.cfg().branch||'main'),{cache:'no-store'});
    if(r.status===404) return {missing:true};
    if(!r.ok) throw new Error('GitHub said '+r.status+(r.status===401?' — the token was rejected':''));
    const j=await r.json(); sha=j.sha;
    return {data:JSON.parse(b64dec(j.content))};
  },
  async push(reg){
    const c=this.cfg();
    const body={message:'Register updated '+new Date().toLocaleString('en-IN'),content:b64enc(JSON.stringify(reg,null,1)),branch:c.branch||'main'};
    if(sha) body.sha=sha;
    const r=await this.api(this.path(),{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||r.status===422) return {conflict:true};
    if(!r.ok) throw new Error('GitHub said '+r.status);
    const j=await r.json(); sha=j.content&&j.content.sha; return {ok:true};
  }
};
function b64enc(str){
  const b=new TextEncoder().encode(str); let s=''; const C=0x8000;
  for(let i=0;i<b.length;i+=C) s+=String.fromCharCode.apply(null,b.subarray(i,i+C));
  return btoa(s);
}
function b64dec(x){
  const s=atob(String(x).replace(/\s/g,'')); const b=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i);
  return new TextDecoder().decode(b);
}
function mergeReg(mine,theirs){
  const out=JSON.parse(JSON.stringify(theirs));
  const byId=new Map(out.madaris.map(m=>[m.id,m]));
  mine.madaris.forEach(m=>{
    const t=byId.get(m.id);
    if(!t){ out.madaris.push(JSON.parse(JSON.stringify(m))); return; }
    const seen=new Set((t.donations||[]).map((d,i)=>donId(t,d,i)));
    (m.donations||[]).forEach((d,i)=>{ if(!seen.has(donId(m,d,i))) t.donations.push(Object.assign({},d)); });
    ['phone','notes','regd','address','name'].forEach(k=>{ if((!t[k]||t[k]==='')&&m[k]) t[k]=m[k]; });
    if(m.mergedInto&&!t.mergedInto) t.mergedInto=m.mergedInto;
    if(m.deleted) t.deleted=true;
  });
  out.reviewDecisions=Object.assign({},theirs.reviewDecisions||{},mine.reviewDecisions||{});
  out.updated=new Date().toISOString();
  return out;
}
function schedulePush(){ syncBadge(); if(!GH.cfg())return; clearTimeout(pushTimer); pushTimer=setTimeout(pushNow,1200); }
async function pushNow(){
  if(!GH.cfg()||pushing||!dirty) return;
  pushing=true; syncBadge();
  try{
    let r=await GH.push(REG);
    if(r.conflict){
      const rem=await GH.pull();
      if(rem.data){ REG=mergeReg(REG,rem.data); saveLocal(); reindex(); renderAll(); }
      r=await GH.push(REG);
      if(r.conflict) throw new Error('could not settle a conflicting change');
    }
    dirty=false;
  }catch(e){ console.warn(e); toast(String(e.message||e),true); }
  finally{ pushing=false; syncBadge(); }
}
function syncBadge(){
  const d=$('#dSync'), t=$('#tSync'); if(!d) return;
  if(!GH.cfg()){ d.className='dot'; t.textContent='Local'; return; }
  if(pushing){ d.className='dot busy'; t.textContent='Saving'; return; }
  if(dirty){ d.className='dot busy'; t.textContent='Unsaved'; return; }
  d.className='dot ok'; t.textContent='Synced';
}

/* ---------- mutations ---------- */
const rawMad = id => REG.madaris.find(m=>m.id===id);
function addDonation(id,amount,date,noteText){
  const m=rawMad(id); if(!m) return;
  (m.donations=m.donations||[]).push({
    id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    year:Number(String(date).slice(0,4)),amount:Number(amount),date:String(date),
    src:'app',note:noteText||'',ts:Date.now()
  });
  touch();
}
function editDonation(mid,did,patch){
  const m=rawMad(mid); if(!m) return;
  const d=(m.donations||[]).find((x,i)=>donId(m,x,i)===did); if(!d) return;
  Object.assign(d,patch);
  if(patch.date) d.year=Number(String(patch.date).slice(0,4));
  touch();
}
function dropDonation(mid,did){
  const m=rawMad(mid); if(!m) return;
  m.donations=(m.donations||[]).filter((x,i)=>donId(m,x,i)!==did);
  touch();
}
function patchMad(id,p){
  const m=rawMad(id);
  if(m) Object.assign(m,p);
  else REG.madaris.push(Object.assign({id,name:'',address:'',regd:'',phone:'',notes:'',altNames:[],altAddresses:[],altRegds:[],donations:[]},p));
  touch();
}

/* ---------- chrome ---------- */
function toast(msg,bad){
  const t=el('div','toast'+(bad?' bad':''),msg);
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(),bad?4200:2400);
}
function panel(head,right){
  const p=el('div','panel');
  if(head){ const h=el('div','ph'); h.appendChild(el('span','eyebrow',head)); if(right)h.appendChild(el('span','r',right)); p.appendChild(h); }
  return p;
}
function noteBox(kind,icon,bold,rest){
  const n=el('div','note'+(kind?' '+kind:''));
  if(icon) n.appendChild(el('span','i',icon));
  const t=el('div');
  if(bold) t.appendChild(el('b',null,bold));
  if(rest) t.appendChild(document.createTextNode(rest));
  n.appendChild(t); return n;
}
function field(host,label,value,type,mono){
  const f=el('div','fl'+(mono?' mono':''));
  f.appendChild(el('span',null,label));
  const i = type==='area'?document.createElement('textarea'):document.createElement('input');
  if(type&&type!=='area') i.type=type;
  if(type==='tel') i.inputMode='tel';
  i.value=value||''; f.appendChild(i); host.appendChild(f); return i;
}

/* A screen: full-screen sheet on a phone, the right-hand pane on a desktop. */
function screenOpen(title, build, opts){
  opts=opts||{};
  if(wide()){
    const host=$('#detail'); host.textContent='';
    const bar=el('div','bar'); const h=el('h2',null,title);
    if(opts.backTo!==undefined){
      const b=el('button','bk','←'); b.type='button'; b.setAttribute('aria-label','Back');
      b.addEventListener('click',()=>{ if(opts.backTo) openMadrasa(opts.backTo); else clearDetail(); });
      bar.appendChild(b);
    }
    bar.appendChild(h); host.appendChild(bar);
    const body=el('div','body scroll'); const inner=el('div','inner'); body.appendChild(inner); host.appendChild(body);
    const close=()=>{ if(opts.backTo) openMadrasa(opts.backTo); else clearDetail(); };
    build(inner, close, {setTitle:t=>h.textContent=t, close, actionHost:host});
    return close;
  }
  const s=el('div','sheet');
  const bar=el('div','bar');
  const b=el('button','bk','←'); b.type='button'; b.setAttribute('aria-label','Back');
  const h=el('h2',null,title);
  bar.append(b,h); s.appendChild(bar);
  const body=el('div','body scroll'); const inner=el('div','inner'); body.appendChild(inner);
  s.appendChild(body); $('#sheets').appendChild(s);
  const close=()=>{ s.remove(); document.removeEventListener('keydown',onKey); };
  function onKey(e){ if(e.key==='Escape'){ e.stopPropagation(); close(); } }
  b.addEventListener('click',close); document.addEventListener('keydown',onKey);
  build(inner, close, {setTitle:t=>h.textContent=t, close, actionHost:s});
  return close;
}
function mountAction(ctx,btn){
  const a=el('div','act'); const i=el('div','inner'); i.appendChild(btn); a.appendChild(i);
  ctx.actionHost.appendChild(a); return a;
}
function clearDetail(){
  selectedId=null;
  const d=$('#detail'); if(!d) return;
  d.textContent='';
  const e=el('div','dempty'); const w=el('div');
  w.appendChild(el('div','t','Pick a madrasa'));
  w.appendChild(el('div','s','Search on the left, or start a new entry. Their whole giving history opens here.'));
  e.appendChild(w); d.appendChild(e);
  renderList();
}

/* ---------- badges ---------- */
function tagFor(m){
  if(m.status==='given') return ['t-given','Gave '+rs(m.thisYearTotal)];
  if(m.status==='lapsed') return ['t-lapsed','Lapsed'];
  if(m.regular) return ['t-regular','Regular ×'+m.priorYears];
  if(m.isNew) return ['t-new','New'];
  return null;
}
function yearSpan(){
  const s=new Set([YEAR]); MAD.forEach(m=>m.years.forEach(y=>s.add(y)));
  return [...s].sort().slice(-5);
}
function rowFor(m,why){
  const b=el('button','row s-'+(m.status==='quiet'?'none':m.status)+(m.id===selectedId?' sel':''));
  b.type='button';
  const top=el('div','rtop');
  top.appendChild(el('div','rname',m.name||'(no name)'));
  if(m.lastAmount!=null){
    const a=el('div','ramt');
    a.appendChild(el('b',null,rs(m.gave?m.thisYearTotal:m.lastAmount)));
    a.appendChild(el('s',null,m.gave?String(YEAR):'last · '+m.lastYear));
    top.appendChild(a);
  }
  b.appendChild(top);
  if(m.address) b.appendChild(el('div','raddr',m.address));
  const f=el('div','rfoot');
  if(m.regd) f.appendChild(el('span','rn',m.regd));
  if(m.phone) f.appendChild(el('span','rn',m.phone));
  const t=tagFor(m); if(t) f.appendChild(el('span','tag '+t[0],t[1]));
  if(why) f.appendChild(el('span','tag t-quiet',why));
  const ys=el('div','yrs');
  yearSpan().forEach(y=>ys.appendChild(el('span','yr'+(m.years.includes(y)?' on':''),String(y).slice(2))));
  f.appendChild(ys); b.appendChild(f);
  b.addEventListener('click',()=>openMadrasa(m.id));
  return b;
}

function listFor(){
  if(query){ const r=search(query); return {title:'Results',items:r.map(x=>x.m),why:r.map(x=>x.why),searching:true}; }
  if(view==='given')  return {title:'Given in '+YEAR,items:MAD.filter(m=>m.gave).sort((a,b)=>tsOf(b)-tsOf(a))};
  if(view==='lapsed') return {title:'Gave last year, not yet this year',items:MAD.filter(m=>m.status==='lapsed').sort((a,b)=>(b.lastAmount||0)-(a.lastAmount||0))};
  if(view==='total')  return {title:'Given in '+YEAR+', largest first',items:MAD.filter(m=>m.gave).sort((a,b)=>b.thisYearTotal-a.thisYearTotal)};
  if(view==='all')    return {title:'Every madrasa, A to Z',items:MAD};
  const recent=MAD.filter(m=>m.donations.some(d=>d.src==='app')).sort((a,b)=>tsOf(b)-tsOf(a));
  if(recent.length) return {title:'Recently recorded',items:recent.slice(0,40)};
  return {title:'Your regular madaris',items:MAD.filter(m=>m.regular).sort((a,b)=>b.total-a.total).slice(0,40),hint:true};
}

/* ---------- amount + date ---------- */
function picker(host,opts){
  let ready=false;
  const usual=opts.usual;
  const presets=[50,100,200,500];
  if(usual!=null && !presets.includes(usual)) presets[3]=usual;
  let value = opts.initial!=null?opts.initial:(usual!=null?usual:null);
  let date  = opts.date||TODAY();

  const grid=el('div','amts'), btns=[];
  presets.forEach(v=>{
    const c=el('div','ac');
    const b=el('button','am',rs(v)); b.type='button'; b.dataset.v=v;
    b.addEventListener('click',()=>{ value=v; sync(); });
    c.appendChild(b);
    if(v===usual) c.appendChild(el('span','flag','USUAL'));
    btns.push(b); grid.appendChild(c);
  });
  host.appendChild(grid);

  const ins=el('div','ins');
  const la=el('label','lb'); la.appendChild(el('span',null,'Amount'));
  const custom=document.createElement('input');
  custom.type='number'; custom.inputMode='numeric'; custom.min='0'; custom.className='in big'; custom.placeholder='Other';
  if(value!=null&&!presets.includes(value)) custom.value=value;
  custom.addEventListener('input',()=>{ value=custom.value===''?null:Number(custom.value); sync(true); });
  la.appendChild(custom);
  const ld=el('label','lb'); ld.appendChild(el('span',null,'Date given'));
  const di=document.createElement('input');
  di.type='date'; di.className='in'; di.value=date; di.max=TODAY();
  di.addEventListener('change',()=>{ date=di.value||TODAY(); sync(); });
  ld.appendChild(di);
  ins.append(la,ld); host.appendChild(ins);

  const q=el('div','dq'), qb=[];
  [['Today',0],['Yesterday',-1],['2 days ago',-2]].forEach(function(pair){
    const lab=pair[0], off=pair[1];
    const b=el('button','dqb',lab); b.type='button';
    b.addEventListener('click',()=>{ const d=new Date(); d.setDate(d.getDate()+off); date=d.toLocaleDateString('en-CA'); di.value=date; sync(); });
    qb.push([b,off]); q.appendChild(b);
  });
  host.appendChild(q);

  function sync(skip){
    btns.forEach(b=>b.classList.toggle('on',value!=null&&Number(b.dataset.v)===value));
    if(!skip) custom.value=(value!=null&&!presets.includes(value))?value:'';
    qb.forEach(function(pair){
      const b=pair[0], off=pair[1];
      const d=new Date(); d.setDate(d.getDate()+off);
      b.classList.toggle('on',date===d.toLocaleDateString('en-CA'));
    });
    if(ready&&opts.onChange) opts.onChange(value,date);
  }
  sync(); ready=true;
  return {get value(){return value;}, get date(){return date;}};
}

/* ---------- the verdict banner: new or previous ---------- */
function verdictFor(m){
  const v=el('div','verdict');
  const k=el('div','k');
  const msg=el('div','m');
  if(m.isNew){
    v.classList.add('v-new'); k.textContent='NEW';
    msg.appendChild(document.createTextNode('First time. Nothing recorded for this madrasa before.'));
  }else if(m.gave){
    v.classList.add('v-warn'); k.textContent='ALREADY GIVEN';
    const dates=m.thisYear.filter(d=>d.date).map(d=>nice(d.date)).join(', ');
    msg.appendChild(el('b',null,rs(m.thisYearTotal)+' this year'));
    msg.appendChild(document.createTextNode(dates?(' on '+dates+'. Save again only for a second visit.'):'. Save again only for a second visit.'));
  }else{
    v.classList.add('v-prev'); k.textContent='PREVIOUS';
    msg.appendChild(el('b',null,'Given '+m.years.length+(m.years.length===1?' time':' times')));
    msg.appendChild(document.createTextNode(m.last ? (' · last '+rs(m.last.amount)+' on '+nice(m.last.date||(m.lastYear+'-01-01'))) : ''));
  }
  v.append(k,msg);
  return v;
}

      }
      syncBadge();
    });
    row.appendChild(sv);
    if(c){
      const off=el('button','btn quiet','Disconnect'); off.type='button';
      off.addEventListener('click',()=>{ GH.clear(); sha=null; toast('Disconnected'); syncBadge(); close(); });
      row.appendChild(off);
    }
    body.appendChild(row);

    const imp=el('button','btn quiet','Load a register file from this device'); imp.type='button'; imp.style.marginTop='9px';
    imp.addEventListener('click',()=>pickFile(close));
    body.appendChild(imp);
  },{backTo:null});
}
function pickFile(after){
  const i=document.createElement('input'); i.type='file'; i.accept='application/json,.json';
  i.addEventListener('change',async ()=>{
    const f=i.files&&i.files[0]; if(!f) return;
    try{
      const p=JSON.parse(await f.text());
      if(!p||!Array.isArray(p.madaris)) throw new Error('That file is not a Rashid register');
      REG=(REG&&REG.madaris.length)?mergeReg(REG,p):p;
      REG.reviewDecisions=REG.reviewDecisions||{}; REG.reviewPairs=REG.reviewPairs||[];
      saveLocal(); reindex(); dirty=true; schedulePush();
      toast('Loaded '+MAD.length+' madaris'); showApp(); renderAll();
      if(after) after();
    }catch(e){ toast(String(e.message||e),true); }
  });
  i.click();
}

/* ---------- boot ---------- */
const emptyReg = ()=>({version:1,updated:null,madaris:[],reviewPairs:[],reviewDecisions:{}});
function showApp(){
  if(REG&&REG.madaris.length){
    $('#boot').hidden=true; $('#app').hidden=false;
    if(wide()&&!selectedId) clearDetail();
  }
}
function setupScreen(){
  $('#bootMsg').innerHTML='Your register is not on this device yet.<br>Connect it once and it stays connected.';
  const b=$('#bootActs'); b.textContent='';
  const gh=el('button','btn primary','Connect your GitHub register'); gh.type='button';
  gh.addEventListener('click',()=>{ $('#boot').hidden=true; $('#app').hidden=false; openSync(); });
  const fl=el('button','btn quiet','Load register.json from this device'); fl.type='button';
  fl.addEventListener('click',()=>pickFile(null));
  b.append(gh,fl);
}
async function boot(){
  const th=LS.get('theme',null); if(th) document.documentElement.setAttribute('data-theme',th);
  REG=LS.get('register',null)||emptyReg();
  REG.reviewDecisions=REG.reviewDecisions||{}; REG.reviewPairs=REG.reviewPairs||[];
  reindex();
  if(MAD.length){ showApp(); renderAll(); }
  if(GH.cfg()){
    try{
      const r=await GH.pull();
      if(r.data){
        const mine=REG;
        REG=mine.madaris.length?mergeReg(mine,r.data):r.data;
        REG.reviewDecisions=REG.reviewDecisions||{}; REG.reviewPairs=REG.reviewPairs||[];
        saveLocal(); reindex();
        if(mine.madaris.length&&JSON.stringify(REG)!==JSON.stringify(mine)){ dirty=true; schedulePush(); }
      }
    }catch(e){ toast(String(e.message||e),true); }
  }
  if(MAD.length){ showApp(); renderAll(); } else setupScreen();
  syncBadge();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- events ---------- */
let qt=null;
$('#q').addEventListener('input',e=>{
  query=e.target.value; $('#qx').hidden=!query;
  clearTimeout(qt); qt=setTimeout(renderAll,55);
});
$('#q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const r=search(query);
    if(r.length) openMadrasa(r[0].m.id);
    else if(query.trim().length>=2) openNew({name:query.trim()});
  }
});
$('#qx').addEventListener('click',()=>{ $('#q').value=''; query=''; $('#qx').hidden=true; renderAll(); $('#q').focus(); });
$('#bNew').addEventListener('click',()=>openNew(query?{name:query.trim()}:{}));
$('#bPhoto').addEventListener('click',()=>{
  screenOpen('From photo',(body)=>{
    body.appendChild(noteBox('sky','\u{1F4F7}','Reading receipts is not switched on yet. ',
      'It is the next piece being added: photograph a receipt and its printed name and Regd No get looked up against your register automatically. Until then, use New entry.'));
  },{backTo:null});
});
$('#bStats').addEventListener('click',openStats);
$('#bSync').addEventListener('click',openSync);
$('#bTheme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  const next=cur==='dark'?'light':cur==='light'?'dark':(sysDark?'light':'dark');
  document.documentElement.setAttribute('data-theme',next); LS.set('theme',next);
});
document.addEventListener('keydown',e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag||'')) return;
  if(e.key==='/'||((e.ctrlKey||e.metaKey)&&e.key==='f')){ e.preventDefault(); $('#q').focus(); $('#q').select(); }
});
window.addEventListener('beforeunload',e=>{ if(dirty&&GH.cfg()){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('online',()=>{ if(dirty) pushNow(); });
matchMedia('(min-width:940px)').addEventListener('change',()=>{
  $('#sheets').textContent='';
  if(wide()){ if(selectedId) openMadrasa(selectedId); else clearDetail(); }
});
document.addEventListener('gesturestart',e=>e.preventDefault());

boot();
})();
</script>
</body>
</html>
